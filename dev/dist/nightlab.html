<title>夜間實驗室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
:root {
  /* 版面：左溫度計 · 中央量筒燒杯 · 右側反應台／可合成／紀錄；窄螢幕改成上下堆疊 */
  --bg: #060a13;
  --bg-glow: #0e1a33;
  --panel: #0b1322;
  --panel-hi: #111c31;
  --line: rgba(150, 188, 232, 0.13);
  --line-hi: rgba(150, 188, 232, 0.28);
  --glass: rgba(185, 222, 255, 0.42);
  --text: #e5ecf6;
  --dim: #93a4bb;
  --faint: #5b6b82;
  --amber: #ffb547; /* 鈉燈 589 nm：分數與選取 */
  --heat: #ff7a3d;
  --cold: #78c4ff;
  --good: #7fdcaa;
  --bad: #ff6b6b;
  --font-display: "LXGW WenKai TC", "Noto Serif TC", "Songti TC", serif;
  --font-ui: system-ui, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-data: "B612 Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-formula: "B612", "Noto Sans", system-ui, sans-serif;
  --cell: 60px;
  --move: 260ms;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(1100px 640px at 50% -12%, var(--bg-glow), transparent 70%),
    linear-gradient(rgba(150, 188, 232, 0.025) 1px, transparent 1px) 0 0 / 28px 28px,
    linear-gradient(90deg, rgba(150, 188, 232, 0.025) 1px, transparent 1px) 0 0 / 28px 28px,
    var(--bg);
  color: var(--text);
  font: 14px/1.5 var(--font-ui);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
sub { font-size: 0.7em; vertical-align: -0.25em; line-height: 0; }

.app {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-inline: 16px;
  padding-block: 10px 16px;
  max-width: 1440px;
  margin: 0 auto;
}
[data-layout="wide"] .app { height: 100%; min-height: 0; }

/* ------------------------------------------------------------ 頂列 */
.bar { display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; margin-right: 4px; }
.brand svg { width: 26px; height: 26px; color: var(--amber); }
.brand h1 { margin: 0; font: 700 22px/1 var(--font-display); letter-spacing: 0.06em; }
.lv { display: flex; align-items: baseline; gap: 8px; }
.lv b { font: 700 20px/1 var(--font-display); }
.els { display: flex; gap: 4px; flex-wrap: wrap; }
.els i {
  font: 700 11px/18px var(--font-formula); font-style: normal; min-width: 18px; padding: 0 3px; text-align: center;
  border-radius: 9px; background: var(--c); color: var(--ink);
}
.goal { flex: 1 1 220px; min-width: 180px; display: grid; gap: 4px; }
.goal .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; color: var(--dim); font-size: 12px; }
.goal .row b { font: 700 18px/1 var(--font-data); color: var(--amber); }
.goal .row span.t { font: 400 13px/1 var(--font-data); color: var(--dim); }
.meter { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.06); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #c77a1b, var(--amber)); box-shadow: 0 0 10px rgba(255, 181, 71, 0.6); transition: width 400ms ease; }
.turns { text-align: center; line-height: 1.1; }
.turns b { display: block; font: 700 24px/1 var(--font-data); }
.turns span { font-size: 11px; color: var(--dim); }
.turns.low b { color: var(--bad); }
.nav { display: flex; gap: 6px; }
.btn {
  border: 1px solid var(--line-hi); background: var(--panel-hi); border-radius: 10px;
  padding: 7px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 38px;
}
.btn:hover { border-color: var(--glass); }
.btn:disabled { opacity: 0.38; cursor: default; }
.btn svg { width: 17px; height: 17px; }
.btn b { font: 700 13px/1 var(--font-data); color: var(--amber); }
.btn.primary { background: linear-gradient(180deg, #ffc15e, #f09a1c); color: #2a1702; border-color: transparent; font-weight: 700; }

/* ------------------------------------------------------------ 主舞台 */
.stage { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
[data-layout="wide"] .stage { flex: 1; min-height: 0; grid-template-columns: 96px auto minmax(0, 1fr); align-items: stretch; }

/* 溫度計 */
.thermo { display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
.tbtn {
  border: 1px solid var(--line-hi); background: var(--panel-hi); border-radius: 12px; padding: 8px 6px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; font-size: 13px;
}
.tbtn svg { width: 20px; height: 20px; }
.tbtn.hot { color: #ffb08a; }
.tbtn.cold { color: #a9d9ff; }
.tbtn:disabled { opacity: 0.35; cursor: default; }
.scale { list-style: none; margin: 0; padding: 6px 0 6px 18px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; position: relative; min-height: 0; }
.scale::before { /* 玻璃管 */
  content: ""; position: absolute; left: 6px; top: 4px; bottom: 4px; width: 6px; border-radius: 3px;
  background: rgba(255, 255, 255, 0.06); box-shadow: inset 0 0 0 1px var(--line-hi);
}
.scale .merc { position: absolute; left: 7px; bottom: 5px; width: 4px; border-radius: 2px; background: var(--tc); box-shadow: 0 0 8px var(--tc); transition: height 500ms ease, background 500ms ease; }
.scale li { position: relative; display: grid; line-height: 1.15; padding: 2px 0 2px 6px; border-radius: 6px; color: var(--faint); transition: color 300ms; }
.scale li .t { font: 700 12px/1.1 var(--font-data); }
.scale li .n { font-size: 11px; }
.scale li.on { color: var(--text); background: color-mix(in oklab, var(--tc) 18%, transparent); }
.scale li.on .t { color: var(--tc); }
.tcount { text-align: center; font-size: 11px; color: var(--dim); }
.tcount b { font: 700 13px/1 var(--font-data); color: var(--amber); }

[data-layout="narrow"] .thermo { flex-direction: row; align-items: center; }
[data-layout="narrow"] .tbtn { flex-direction: row; padding: 8px 10px; }
[data-layout="narrow"] .scale { flex-direction: row; padding: 0; gap: 3px; }
[data-layout="narrow"] .scale::before, [data-layout="narrow"] .scale .merc { display: none; }
[data-layout="narrow"] .scale li { flex: 1; text-align: center; padding: 4px 1px; justify-items: center; }
[data-layout="narrow"] .scale li .n { font-size: 10px; }
[data-layout="narrow"] .tcount { white-space: nowrap; }
[data-layout="narrow"] .scale li { min-width: 0; }
@media (max-width: 599px) {
  [data-layout="narrow"] .thermo { flex-wrap: wrap; justify-content: space-between; }
  [data-layout="narrow"] .tbtn.hot { order: 0; }
  [data-layout="narrow"] .tcount { order: 1; }
  [data-layout="narrow"] .tbtn.cold { order: 2; }
  [data-layout="narrow"] .scale { order: 3; flex: 1 1 100%; }
  [data-layout="narrow"] .scale li .n { font-size: 9px; }
}

/* 燒杯 */
.vessel-area { position: relative; display: flex; flex-direction: column; align-items: center; justify-self: center; padding-left: 34px; }
.badges { display: grid; grid-template-columns: repeat(7, var(--cell)); height: 24px; margin-bottom: 4px; padding-inline: 8px; }
.badge { text-align: center; font: 700 12px/22px var(--font-data); color: var(--faint); border-radius: 6px; margin: 0 3px; }
.badge.pos { color: #2a1702; background: var(--amber); box-shadow: 0 0 10px rgba(255, 181, 71, 0.45); }
.badge.full { color: var(--bad); font-family: var(--font-ui); }
.badge[data-chain]::after { content: "鏈" attr(data-chain); font-size: 9px; margin-left: 2px; vertical-align: 1px; }
.beaker {
  position: relative; width: calc(var(--cell) * 7 + 16px); height: calc(var(--cell) * 9 + 10px);
  padding: 0 8px 10px; border: 2px solid var(--glass); border-top: 0; border-radius: 0 0 28px 28px;
  background: linear-gradient(180deg, rgba(150, 200, 255, 0.025), rgba(150, 200, 255, 0.07));
  box-shadow: inset 0 0 44px rgba(120, 180, 255, 0.06), inset 7px 0 0 -5px rgba(255, 255, 255, 0.06);
  transition: box-shadow 500ms ease, background 500ms ease;
  touch-action: none;
}
.beaker::before, .beaker::after { /* 杯口 */
  content: ""; position: absolute; top: -2px; width: 12px; height: 2px; background: var(--glass);
}
.beaker::before { left: -12px; border-radius: 2px 0 0 2px; }
.beaker::after { right: -12px; }
.slots {
  position: absolute; left: 8px; top: 0; width: calc(var(--cell) * 7); height: calc(var(--cell) * 9);
  background-image: radial-gradient(circle at center, rgba(160, 200, 255, 0.10) 1.2px, transparent 1.6px);
  background-size: var(--cell) var(--cell);
}
.colhi { position: absolute; top: 0; width: var(--cell); height: calc(var(--cell) * 9); background: linear-gradient(180deg, rgba(255, 181, 71, 0.10), rgba(255, 181, 71, 0.03)); border-radius: 8px; pointer-events: none; }
.layer { position: absolute; left: 8px; top: 0; width: calc(var(--cell) * 7); height: calc(var(--cell) * 9); }
.layer { pointer-events: none; }
.layer .tile { pointer-events: auto; cursor: pointer; }
.ticks { position: absolute; left: -36px; top: 0; height: calc(var(--cell) * 9); width: 30px; pointer-events: none; }
.ticks i { position: absolute; right: 0; height: 1px; width: 8px; background: var(--glass); }
.ticks i.l { width: 14px; }
.ticks span { position: absolute; right: 16px; transform: translateY(-50%); font: 400 10px/1 var(--font-data); color: var(--faint); }
.ticks em { position: absolute; right: 0; bottom: -22px; font: 400 10px/1 var(--font-data); color: var(--faint); font-style: normal; }
.source { margin-top: 10px; height: 26px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: var(--dim); position: relative; width: 100%; }
.source .heat { width: 60%; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.05); transition: background 500ms, box-shadow 500ms; }

.vessel-area[data-temp="0"] .beaker { box-shadow: inset 0 0 50px rgba(180, 230, 255, 0.22), 0 0 34px rgba(150, 220, 255, 0.28); background: linear-gradient(180deg, rgba(200, 235, 255, 0.10), rgba(150, 210, 255, 0.10)); }
.vessel-area[data-temp="1"] .beaker { box-shadow: inset 0 0 44px rgba(140, 200, 255, 0.16), 0 0 22px rgba(120, 190, 255, 0.16); }
.vessel-area[data-temp="2"] .beaker { box-shadow: inset 0 0 40px rgba(140, 200, 255, 0.10); }
.vessel-area[data-temp="4"] .heat { background: linear-gradient(90deg, #6b2a12, #ff7a3d, #6b2a12); box-shadow: 0 0 14px rgba(255, 122, 61, 0.55); }
.vessel-area[data-temp="5"] .heat { background: radial-gradient(60% 140% at 50% 100%, #8fd0ff, #3b6dff 55%, transparent 75%); box-shadow: 0 -6px 18px rgba(80, 140, 255, 0.55); }
.vessel-area[data-temp="5"] .beaker { box-shadow: inset 0 -30px 40px -20px rgba(255, 140, 60, 0.18); }
.vessel-area[data-temp="6"] .heat { background: linear-gradient(90deg, #7a1608, #ff5a1f, #ffcf6b, #ff5a1f, #7a1608); box-shadow: 0 0 22px rgba(255, 90, 31, 0.7); }
.vessel-area[data-temp="6"] .beaker { box-shadow: inset 0 0 50px rgba(255, 110, 40, 0.22), 0 0 30px rgba(255, 90, 31, 0.3); }

/* 分子方塊：固體＝晶體、液體＝水滴、氣體＝發光的氣泡 */
.tile { position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); padding: calc(var(--cell) * 0.055); transition: transform var(--move) cubic-bezier(0.25, 0.8, 0.25, 1); will-change: transform; }
.tile.instant { transition: none; }
.tile .body {
  width: 100%; height: 100%; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  transition: transform 220ms ease, opacity 220ms ease, border-radius 300ms ease;
}
.tile.enter .body { transform: scale(0.3); opacity: 0; }
.tile.gone .body { transform: scale(1.3); opacity: 0; }
.tile.sel .body { outline: 2px solid var(--amber); outline-offset: 2px; }
.tile .f { font: 700 calc(var(--cell) * var(--fs)) / 1 var(--font-formula); letter-spacing: -0.02em; white-space: nowrap; position: relative; }
.tile .dots { display: flex; gap: 2px; position: relative; }
.tile .dots i { width: calc(var(--cell) * 0.075); height: calc(var(--cell) * 0.075); border-radius: 50%; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35); }
[data-phase="s"] > .body, .sw[data-phase="s"] {
  border-radius: 7px; color: var(--ink);
  background: linear-gradient(150deg, color-mix(in oklab, var(--c1) 68%, white) 0%, var(--c1) 42%, color-mix(in oklab, var(--c1) 60%, black) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), inset 0 -3px 0 rgba(0, 0, 0, 0.28), 0 2px 6px rgba(0, 0, 0, 0.45);
}
[data-phase="s"] > .body::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(115deg, transparent 36%, rgba(255, 255, 255, 0.26) 37%, transparent 56%); pointer-events: none; }
[data-phase="l"] > .body, .sw[data-phase="l"] {
  border-radius: 44% 44% 48% 48% / 34% 34% 62% 62%; color: var(--ink);
  background: radial-gradient(110% 85% at 50% 18%, color-mix(in oklab, var(--c1) 55%, white) 0%, var(--c1) 48%, color-mix(in oklab, var(--c1) 55%, black) 100%);
  box-shadow: inset 0 -6px 10px rgba(0, 0, 0, 0.25), 0 3px 8px rgba(0, 0, 0, 0.4);
}
[data-phase="l"] > .body::before { content: ""; position: absolute; left: 24%; right: 24%; top: 8%; height: 11%; border-radius: 50%; background: rgba(255, 255, 255, 0.38); }
[data-phase="g"] > .body, .sw[data-phase="g"] {
  border-radius: 50%; color: color-mix(in oklab, var(--c1) 30%, white);
  background: radial-gradient(circle at 50% 45%, color-mix(in oklab, var(--c1) 42%, transparent) 0%, color-mix(in oklab, var(--c1) 14%, transparent) 62%, transparent 72%);
  border: 1.5px solid color-mix(in oklab, var(--c1) 78%, transparent);
  box-shadow: 0 0 calc(var(--cell) * 0.22) color-mix(in oklab, var(--c1) 42%, transparent), inset 0 0 calc(var(--cell) * 0.18) color-mix(in oklab, var(--c1) 30%, transparent);
}
.tile[data-phase="g"] > .body { animation: bob 2.6s ease-in-out infinite alternate; }
.tile[data-phase="g"]:nth-child(3n) > .body { animation-duration: 3.1s; }
.tile[data-phase="g"]:nth-child(3n + 1) > .body { animation-delay: -1.2s; }
@keyframes bob { from { translate: 0 -1.5px; } to { translate: 0 1.5px; } }
.ghost { position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); padding: calc(var(--cell) * 0.07); pointer-events: none; }
.ghost .body { width: 100%; height: 100%; border: 2px dashed rgba(255, 181, 71, 0.55); border-radius: 10px; background: rgba(255, 181, 71, 0.06); }
.ghost.hot .body { border-style: solid; border-color: var(--amber); background: rgba(255, 181, 71, 0.16); }

/* 特效 */
.fx { position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); pointer-events: none; }
.fx::before { content: ""; position: absolute; inset: 6%; border-radius: 50%; border: 3px solid var(--fxc); box-shadow: 0 0 18px var(--fxc), inset 0 0 12px var(--fxc); animation: ring 620ms ease-out forwards; }
.fx-react { --fxc: #ffd27a; }
.fx-burn { --fxc: #ff6a2b; }
.fx-collect { --fxc: #c8f6ff; }
.fx-decomp { --fxc: #c79bff; }
.fx-burn::after, .fx-collect::after {
  content: ""; position: absolute; inset: -10%; border-radius: 50%;
  background: radial-gradient(circle, var(--fxc) 0%, color-mix(in oklab, var(--fxc) 40%, transparent) 40%, transparent 70%);
  animation: flare 560ms ease-out forwards;
}
@keyframes ring { from { transform: scale(0.35); opacity: 1; } to { transform: scale(1.55); opacity: 0; } }
@keyframes flare { from { transform: scale(0.5); opacity: 0.95; } to { transform: scale(1.3); opacity: 0; } }
.pop { position: absolute; left: 0; top: 0; font: 700 19px/1 var(--font-data); color: var(--amber); text-shadow: 0 0 12px rgba(255, 181, 71, 0.7), 0 2px 2px #000; pointer-events: none; white-space: nowrap; animation: rise 1000ms ease-out forwards; z-index: 5; }
.pop i { font-style: normal; font-size: 13px; color: #fff; margin-left: 4px; }
@keyframes rise { 0% { opacity: 0; translate: -50% 4px; } 15% { opacity: 1; } 100% { opacity: 0; translate: -50% -46px; } }
.banner { position: absolute; left: 50%; top: 42%; translate: -50% -50%; pointer-events: none; font: 700 44px/1 var(--font-display); color: var(--amber); text-shadow: 0 0 22px rgba(255, 181, 71, 0.8), 0 3px 3px #000; white-space: nowrap; animation: bannerIn 900ms ease-out forwards; z-index: 6; }
@keyframes bannerIn { 0% { opacity: 0; scale: 0.6; } 20% { opacity: 1; scale: 1.08; } 70% { opacity: 1; scale: 1; } 100% { opacity: 0; scale: 1; } }

/* ------------------------------------------------------------ 右側 */
.side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
[data-layout="wide"] .side { min-height: 0; }
.panel { background: color-mix(in oklab, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.panel > header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.panel h2 { margin: 0; font: 700 16px/1.2 var(--font-display); letter-spacing: 0.04em; }
.hint { font-size: 12px; color: var(--dim); }

.tray { display: flex; flex-wrap: wrap; gap: 6px; }
.atom {
  width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; position: relative;
  font: 700 15px/1 var(--font-formula); color: var(--ink);
  background: radial-gradient(circle at 34% 30%, color-mix(in oklab, var(--c) 35%, white) 0%, var(--c) 42%, color-mix(in oklab, var(--c) 52%, black) 100%);
  box-shadow: 0 3px 6px rgba(0, 0, 0, 0.5), inset 0 -2px 3px rgba(0, 0, 0, 0.25);
  transition: transform 160ms ease, opacity 160ms ease, box-shadow 160ms ease;
}
.atom.use { transform: translateY(-4px); box-shadow: 0 0 0 2px var(--amber), 0 6px 12px rgba(0, 0, 0, 0.5); }
.tray.dim .atom:not(.use) { opacity: 0.45; }

[data-layout="wide"] .candp { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.cands { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; overflow-y: auto; align-content: start; padding: 2px; }
[data-layout="wide"] .cands { flex: 1; min-height: 0; }
.cand {
  display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; grid-template-rows: auto auto; column-gap: 8px; align-items: center;
  text-align: left; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-hi); cursor: pointer;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.cand:hover { border-color: var(--line-hi); }
.cand.on { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber), 0 0 16px rgba(255, 181, 71, 0.25); background: color-mix(in oklab, var(--panel-hi) 85%, var(--amber)); }
.cand .sw { grid-row: 1 / 3; width: 30px; height: 30px; display: block; }
.cand .sw[data-phase="g"] { width: 28px; height: 28px; }
.cand .cf { font: 700 15px/1.1 var(--font-formula); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cand .cn { grid-column: 2; font: 400 12px/1.2 var(--font-display); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cand .cv { grid-column: 3; grid-row: 1; font: 700 14px/1 var(--font-data); color: var(--amber); text-align: right; }
.cand .cp { grid-column: 3; grid-row: 2; font-size: 11px; text-align: right; color: var(--dim); }
.empty { color: var(--dim); font-size: 13px; padding: 8px 2px; }

.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.tools .btn { flex: 1 1 0; justify-content: center; min-width: 96px; }
.tools .btn.spark { color: #ffe08a; }

[data-layout="wide"] .logp { flex: 0 0 auto; height: 28%; min-height: 130px; display: flex; flex-direction: column; position: relative; }
.logp { position: relative; }
.log { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: grid; gap: 4px; align-content: start; }
[data-layout="wide"] .log { flex: 1; min-height: 0; }
[data-layout="narrow"] .log { max-height: 220px; }
.log li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: baseline; font-size: 13px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
.log .k { font-size: 11px; color: var(--dim); white-space: nowrap; border: 1px solid var(--line-hi); border-radius: 6px; padding: 0 5px; }
.log .eq { font: 400 13px/1.35 var(--font-formula); overflow-wrap: anywhere; }
.log .eq small { color: var(--faint); font-family: var(--font-ui); }
.log .g { font: 700 13px/1 var(--font-data); color: var(--amber); white-space: nowrap; }
.log .g i { font-style: normal; color: var(--text); font-size: 11px; margin-left: 3px; }

<script>
/* 夜間實驗室 — 遊戲邏輯（純函式，不碰 DOM；Node 可直接 require 測試）
 *
 * 燒杯 7 欄 × 9 列。每格一個分子。
 *   - 依目前溫度與真實熔沸點決定物態：氣體從杯頂往下堆，液體／固體從杯底往上堆
 *   - 3 個以上相同分子相連 → 收集得分
 *   - 能反應的分子相鄰 → 自動反應（產物留在杯中，可能再引發連鎖）
 *   - 每多一段連鎖，分數 ×2
 *   - 溫控：改變物態、觸發熱分解與需要加熱的反應；火花：點燃可燃物、觸發光照反應
 */
const Lab = (() => {
  'use strict';

  const VERSION = 1;
  const W = 7, H = 9;
  const TRAY_START = 7, TRAY_MAX = 12, TURNS = 14;
  const BASE_MAX = { temp: 3, spark: 2, redraw: 3, undo: 3 };

  // ---------------------------------------------------------------- 元素（CPK 配色）
  const ELEMENTS = {
    H:  { z: 1,  zh: '氫', color: '#eef2f6', base: 1, w: 5 },
    C:  { z: 6,  zh: '碳', color: '#7d8796', base: 3, w: 3 },
    N:  { z: 7,  zh: '氮', color: '#4f6dff', base: 3, w: 2 },
    O:  { z: 8,  zh: '氧', color: '#ff4b3e', base: 2, w: 3 },
    F:  { z: 9,  zh: '氟', color: '#bdf07f', base: 4, w: 2 },
    Na: { z: 11, zh: '鈉', color: '#ab6df3', base: 3, w: 2 },
    Mg: { z: 12, zh: '鎂', color: '#93d43c', base: 4, w: 2 },
    S:  { z: 16, zh: '硫', color: '#f5d43e', base: 4, w: 2 },
    Cl: { z: 17, zh: '氯', color: '#33d466', base: 3, w: 2 },
    Ca: { z: 20, zh: '鈣', color: '#36a463', base: 4, w: 2 },
  };
  const START_ELEMENTS = ['H', 'O'];
  const UNLOCK_ORDER = ['C', 'N', 'F', 'Na', 'Mg', 'S', 'Cl', 'Ca']; // 依原子序
  const COLOR_PRIORITY = ['Na', 'Mg', 'Ca', 'Cl', 'F', 'S', 'N', 'C', 'O', 'H'];

  // ---------------------------------------------------------------- 實驗器材（被動加成）
  const RELICS = {
    buret: { zh: '滴定管', desc: '酸鹼類反應（中和、金屬與酸、碳酸鹽與酸）分數 ×2' },
    lighter: { zh: '點火槍', desc: '燃燒反應分數 ×2' },
    furnace: { zh: '坩堝', desc: '熱分解與需要加熱的反應分數 ×2' },
    condenser: { zh: '冷凝管', desc: '收集液體分數 ×2' },
    gasjar: { zh: '集氣瓶', desc: '收集氣體分數 ×2' },
    mortar: { zh: '研缽', desc: '收集固體分數 ×2' },
  };
  const ACID_KINDS = new Set(['酸鹼中和', '氧化物與酸', '金屬與酸', '碳酸鹽與酸']);
  const has = (st, r) => !!(st.relics && st.relics.includes(r));

  // ---------------------------------------------------------------- 溫度段
  const TEMPS = [
    { t: -196, name: '液態氮' },
    { t: -80, name: '乾冰浴' },
    { t: -40, name: '冷凍庫' },
    { t: 25, name: '室溫' },
    { t: 110, name: '加熱板' },
    { t: 350, name: '本生燈' },
    { t: 900, name: '高溫爐' },
  ];
  const ROOM = 3;

  // ---------------------------------------------------------------- 化學式
  function parseFormula(f) {
    let i = 0;
    function group() {
      const out = {};
      while (i < f.length && f[i] !== ')') {
        let part;
        if (f[i] === '(') {
          i++;
          part = group();
          if (f[i] !== ')') throw new Error('bad formula ' + f);
          i++;
        } else {
          const m = /^[A-Z][a-z]?/.exec(f.slice(i));
          if (!m) throw new Error('bad formula ' + f);
          part = { [m[0]]: 1 };
          i += m[0].length;
        }
        const d = /^\d+/.exec(f.slice(i));
        let k = 1;
        if (d) { k = +d[0]; i += d[0].length; }
        for (const e in part) out[e] = (out[e] || 0) + part[e] * k;
      }
      return out;
    }
    const r = group();
    if (i !== f.length) throw new Error('bad formula ' + f);
    return r;
  }

  // ---------------------------------------------------------------- 配平（求整數零空間）
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; }
  function balance(lhs, rhs) {
    const sp = [...lhs, ...rhs];
    const comps = sp.map(parseFormula);
    const els = [...new Set(comps.flatMap((o) => Object.keys(o)))];
    const n = sp.length;
    const norm = ([a, b]) => { if (b < 0) { a = -a; b = -b; } const g = gcd(a, b) || 1; return [a / g, b / g]; };
    const sub = (x, y) => norm([x[0] * y[1] - y[0] * x[1], x[1] * y[1]]);
    const mul = (x, y) => norm([x[0] * y[0], x[1] * y[1]]);
    const div = (x, y) => norm([x[0] * y[1], x[1] * y[0]]);
    const M = els.map((e) => sp.map((s, j) => [(comps[j][e] || 0) * (j < lhs.length ? 1 : -1), 1]));
    const piv = [];
    let r = 0;
    for (let c = 0; c < n && r < M.length; c++) {
      let p = -1;
      for (let k = r; k < M.length; k++) if (M[k][c][0] !== 0) { p = k; break; }
      if (p < 0) continue;
      [M[r], M[p]] = [M[p], M[r]];
      const pv = M[r][c];
      M[r] = M[r].map((v) => div(v, pv));
      for (let k = 0; k < M.length; k++) {
        if (k !== r && M[k][c][0] !== 0) {
          const f = M[k][c];
          M[k] = M[k].map((v, j) => sub(v, mul(f, M[r][j])));
        }
      }
      piv.push(c);
      r++;
    }
    const free = [];
    for (let c = 0; c < n; c++) if (!piv.includes(c)) free.push(c);
    if (free.length === 0) return null;
    if (free.length > 1) {
      // 不只一種配法（例如 O₃ + NO → NO₂ + O₂）：找係數和最小的正整數解
      const Z = els.map((e) => sp.map((s, j) => (comps[j][e] || 0) * (j < lhs.length ? 1 : -1)));
      let best = null;
      const v = new Array(n).fill(1);
      const rec = (j) => {
        if (j === n) {
          if (Z.every((row) => row.reduce((a, c, k) => a + c * v[k], 0) === 0)) {
            const s = v.reduce((a, b) => a + b, 0);
            if (!best || s < best.s) best = { s, v: v.slice() };
          }
          return;
        }
        for (let k = 1; k <= 8; k++) { v[j] = k; rec(j + 1); }
      };
      rec(0);
      return best ? best.v : null;
    }
    const x = new Array(n);
    x[free[0]] = [1, 1];
    piv.forEach((c, i) => { x[c] = norm([-M[i][free[0]][0], M[i][free[0]][1]]); });
    const l = x.reduce((a, [, d]) => (a / gcd(a, d)) * d, 1);
    let ints = x.map(([a, d]) => a * (l / d));
    const g = ints.reduce((a, v) => gcd(a, v), 0);
    ints = ints.map((v) => v / g);
    if (ints.every((v) => v < 0)) ints = ints.map((v) => -v);

  }
  const eqCache = new Map();
  function equation(lhs, rhs, html = true) {
    const key = lhs.join('+') + '>' + rhs.join('+') + (html ? 'h' : 't');
    if (eqCache.has(key)) return eqCache.get(key);
    const co = balance(lhs, rhs) || [...lhs, ...rhs].map(() => 1);
    const fmt = html ? fHTML : fText;
    const term = (s, k) => (k > 1 ? k + (html ? '' : '') : '') + fmt(s);
    const out = lhs.map((s, i) => term(s, co[i])).join(' + ') + ' → ' + rhs.map((s, i) => term(s, co[lhs.length + i])).join(' + ');
    eqCache.set(key, out);
    return out;

  const rxEquation = (rx, html) => equation(rx.a === rx.b ? [rx.a] : [rx.a, rx.b], rx.full, html);
  const decEquation = (id, html) => equation([id], C[id].dec.full, html);

  // ---------------------------------------------------------------- 物態、分數
  function phaseAt(id, T) {
    const c = C[id], t = TEMPS[T].t;
    if (t < c.mp) return 's';
    if (t < c.bp) return 'l';
    return 'g';
  }
  const upMult = (st, e) => 1 + 0.5 * ((st.up && st.up[e]) || 0);
  /** 分子價值 = 原子底分總和 ×（越大的分子加成越多）× 每個已強化元素的倍率（相乘） */
  function value(st, id) {
    const c = C[id];
    let s = 0, m = 1;
    for (const e in c.counts) s += c.counts[e] * ELEMENTS[e].base;
    for (const e of c.els) m *= upMult(st, e);
    return Math.max(1, Math.round(s * (1 + 0.15 * (c.n - 1)) * m));
  }
  function targetFor(level) {
    return Math.round(TARGET_BASE * Math.pow(TARGET_GROWTH, level - 1) / 5) * 5;
  }
  let TARGET_BASE = 60, TARGET_GROWTH = 1.17;

  // ---------------------------------------------------------------- 亂數、元素袋、反應台
  function rand(st) {
    let t = (st.rng = (st.rng + 0x6d2b79f5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function drawAtom(st) {
    let tot = 0;
    for (const e of st.unlocked) tot += st.bag[e] || 0;
    let r = rand(st) * tot;
    for (const e of st.unlocked) { r -= st.bag[e] || 0; if (r < 0) return e; }
    return st.unlocked[st.unlocked.length - 1];
  }
  function trayCounts(tray) { const m = {}; for (const e of tray) m[e] = (m[e] || 0) + 1; return m; }
  function candidates(st) {
    const have = trayCounts(st.tray);
    const out = [];
    for (const id in C) {
      const c = C[id];
      if (c.n > st.traySize) continue;
      let ok = true;
      for (const e in c.counts) if (!st.unlocked.includes(e) || (have[e] || 0) < c.counts[e]) { ok = false; break; }
      if (ok) out.push(id);
    }
    out.sort((a, b) => value(st, b) - value(st, a) || C[a].n - C[b].n || (a < b ? -1 : 1));
    return out;
  }
  const sortTray = (st) => st.tray.sort((a, b) => ELEMENTS[a].z - ELEMENTS[b].z);
  function refill(st) {
    for (let tries = 0; tries < 20; tries++) {
      while (st.tray.length < st.traySize) st.tray.push(drawAtom(st));

    }
  }
  /** 這個分子會用掉反應台上的哪幾格（index） */
  function atomsFor(st, id) {
    const need = { ...C[id].counts };
    const idx = [];
    st.tray.forEach((e, i) => { if (need[e] > 0) { need[e]--; idx.push(i); } });
    return idx;
  }

  // ---------------------------------------------------------------- 燒杯
  const colItems = (st, x) => st.grid[x].filter(Boolean);
  function settleCol(st, x) {
    const items = colItems(st, x);
    const gas = [], cond = [];
    for (const c of items) (phaseAt(c.c, st.T) === 'g' ? gas : cond).push(c);
    const col = new Array(H).fill(null);
    gas.forEach((c, i) => { col[i] = c; });
    cond.forEach((c, i) => { col[H - cond.length + i] = c; });
    let moved = false;
    for (let i = 0; i < H; i++) if (col[i] !== st.grid[x][i]) moved = true;

    return moved;
  }
  function settle(st) { let m = false; for (let x = 0; x < W; x++) m = settleCol(st, x) || m; return m; }
  const canPlace = (st, x) => x >= 0 && x < W && colItems(st, x).length < H;
  function place(st, id, x) {
    const items = colItems(st, x);
    const nGas = items.filter((c) => phaseAt(c.c, st.T) === 'g').length;
    const cell = { id: st.uid++, c: id };
    items.splice(nGas, 0, cell); // 氣體疊在既有氣體下方；液固體疊在既有液固體上方
    st.grid[x] = items.concat(new Array(H - items.length).fill(null));

  }
  const snap = (st) => st.grid.map((col) => col.map((c) => (c ? { id: c.id, c: c.c } : null)));
  function posOf(st, id) {
    for (let x = 0; x < W; x++) for (let y = 0; y < H; y++) if (st.grid[x][y] && st.grid[x][y].id === id) return [x, y];
    return null;
  }

  // ---------------------------------------------------------------- 反應判定
  function rxActive(st, rx, spark) {
    const t = TEMPS[st.T].t;
    if (rx.cond === 'spark') { if (!spark) return false; }
    else if (rx.cond === 'burn') { if (!spark && !(C[rx.a].ai != null && t >= C[rx.a].ai)) return false; }
    else if (typeof rx.cond === 'number') { if (t < rx.cond) return false; }
    // 產物在這個溫度會分解 → 平衡往回，不反應（例如高溫下 N₂ + H₂ 不會生成 NH₃）
    for (const p of rx.full) if (C[p].dec && t >= C[p].dec.t) return false;
    return true;
  }
  const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
  function findReactions(st, spark) {
    const used = new Set(), out = [];
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const a = st.grid[x][y];
        if (!a || used.has(a.id)) continue;
        for (const [dx, dy] of DIRS) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
          const b = st.grid[nx][ny];
          if (!b || used.has(b.id)) continue;
          const r = PAIR.get(a.c + '|' + b.c);
          if (!r || !rxActive(st, r.rx, spark)) continue;
          used.add(a.id); used.add(b.id);
          out.push(r.flip ? { rx: r.rx, A: [nx, ny, b], B: [x, y, a] } : { rx: r.rx, A: [x, y, a], B: [nx, ny, b] });

        }
      }
    }
    return out;
  }
  function sparkable(st) {
    for (let x = 0; x < W; x++) {
      for (let y = 0; y < H; y++) {
        const a = st.grid[x][y];
        if (!a) continue;
        for (const [dx, dy] of DIRS.slice(0, 2)) {
          const nx = x + dx, ny = y + dy;
          if (nx >= W || ny >= H) continue;
          const b = st.grid[nx][ny];
          if (!b) continue;
          const r = PAIR.get(a.c + '|' + b.c);
          if (r && (r.rx.cond === 'spark' || r.rx.cond === 'burn') && rxActive(st, r.rx, true)) return true;
        }
      }
    }
    return false;
  }
  function findDecomps(st) {
    const t = TEMPS[st.T].t, out = [];
    for (let x = 0; x < W; x++) for (let y = 0; y < H; y++) {
      const a = st.grid[x][y];
      if (a && C[a.c].dec && t >= C[a.c].dec.t) out.push([x, y, a]);
    }
    return out;
  }
  function findClusters(st) {
    const seen = new Set(), groups = [];
    for (let x = 0; x < W; x++) {
      for (let y = 0; y < H; y++) {
        const a = st.grid[x][y];
        if (!a || seen.has(a.id)) continue;
        const group = [], stack = [[x, y]];
        seen.add(a.id);
        while (stack.length) {
          const [cx, cy] = stack.pop();
          group.push([cx, cy, st.grid[cx][cy]]);
          for (const [dx, dy] of DIRS) {
            const nx = cx + dx, ny = cy + dy;
            if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;

            if (b && b.c === a.c && !seen.has(b.id)) { seen.add(b.id); stack.push([nx, ny]); }
          }
        }

      }
    }

  }

  // ---------------------------------------------------------------- 結算（連鎖）
  function resolve(st, opts = {}) {
    const steps = [];
    const found = new Set(), foundRx = new Set();
    let depth = 0, total = 0, spark = !!opts.spark;
    const newCell = (id) => { found.add(id); return { id: st.uid++, c: id }; };
    if (settle(st)) steps.push({ kind: 'settle', grid: snap(st) });
    for (let wave = 0; wave < 60; wave++) {
      const mult = Math.min(64, 2 ** depth);
      // 1. 熱分解
      const dec = findDecomps(st);
      if (dec.length) {
        let gain = 0;
        const fx = [], logs = [];
        const extra = new Map(); // cell -> 第二個產物
        for (const [x, y, a] of dec) {
          const d = C[a.c].dec;
          const p0 = newCell(d.keep[0]);
          st.grid[x][y] = p0;
          if (d.keep[1]) extra.set(p0, d.keep[1]);
          const g = Math.round(value(st, a.c) * 0.5 * (has(st, 'furnace') ? 2 : 1)) * mult;
          gain += g;
          fx.push({ x, y, type: 'decomp' });
          logs.push({ k: 'dec', c: a.c, gain: g, mult, vent: [] });
          foundRx.add('dec:' + a.c);
        }
        // 第二個產物插在第一個產物之後（同一欄）；放不下就逸出杯外
        for (let x = 0; x < W; x++) {
          const items = colItems(st, x);
          const out = [];
          for (const c of items) {
            out.push(c);
            if (extra.has(c)) out.push({ id: st.uid++, c: extra.get(c), pending: true });
          }
          while (out.length > H) {
            const i = out.findIndex((c) => c.pending);
            const v = out.splice(i, 1)[0];
            const lg = logs.find((l) => C[l.c].dec.keep[1] === v.c && l.vent.length === 0) || logs[0];
            lg.vent.push(v.c);
          }
          for (const c of out) if (c.pending) { delete c.pending; found.add(c.c); }
          st.grid[x] = out.concat(new Array(H - out.length).fill(null));
        }
        settle(st);
        total += gain;
        steps.push({ kind: 'decomp', fx, gain, mult, grid: snap(st), logs });

      // 2. 相鄰反應
      const rxs = findReactions(st, spark);

      if (rxs.length) {
        let gain = 0;

        for (const { rx, A, B } of rxs) {
          let rm = 2;
          if (ACID_KINDS.has(rx.kind) && has(st, 'buret')) rm *= 2;

          gain += g;
          st.grid[A[0]][A[1]] = rx.keep[0] ? newCell(rx.keep[0]) : null;
          st.grid[B[0]][B[1]] = rx.keep[1] ? newCell(rx.keep[1]) : null;
          fx.push({ x: A[0], y: A[1], type: rx.cond === 'burn' ? 'burn' : 'react' }, { x: B[0], y: B[1], type: rx.cond === 'burn' ? 'burn' : 'react' });

          foundRx.add(rx.key);
        }

      if (groups.length) {

        const fx = [], logs = [];
        for (const g of groups) {
          const n = g.length, id = g[0][2].c;
          const ph = phaseAt(id, st.T);
          const rel = (ph === 'l' && has(st, 'condenser')) || (ph === 'g' && has(st, 'gasjar')) || (ph === 's' && has(st, 'mortar')) ? 2 : 1;
          const pts = Math.round(value(st, id) * n * (1 + 0.5 * (n - 3)) * rel) * mult;
          gain += pts;
          for (const [x, y] of g) { st.grid[x][y] = null; fx.push({ x, y, type: 'collect' }); }
          logs.push({ k: 'cl', c: id, n, gain: pts, mult });
        }
        total += gain;
        steps.push({ kind: 'cluster', fx, gain, mult, grid: snap(st), logs });
        if (settle(st)) steps.push({ kind: 'settle', grid: snap(st) });

        continue;
      }
      break;
    }

  // ---------------------------------------------------------------- 一局
  function newRun(seed) {
    const st = {
      v: VERSION, rng: seed >>> 0, level: 1,
      unlocked: START_ELEMENTS.slice(), bag: {}, up: {},
      traySize: TRAY_START, max: { ...BASE_MAX }, uid: 1, relics: [],
      log: [], best: { chain: 0, turn: 0 },
    };
    for (const e of START_ELEMENTS) st.bag[e] = ELEMENTS[e].w;
    startLevel(st);
    return st;
  }
  function startLevel(st) {
    st.grid = Array.from({ length: W }, () => new Array(H).fill(null));
    st.T = ROOM;
    st.score = 0;
    st.target = targetFor(st.level);
    st.turnsLeft = TURNS;
    st.charges = { ...st.max };
    st.phase = 'play';
    st.offers = null;
    st.picks = 0;
    st.endReason = null;
    st.tray = [];
    st.log = [];
    refill(st);
    st.levelStart = null;
    st.levelStart = JSON.stringify(st);
  }
  function retryLevel(st, seed) {
    const s = JSON.parse(st.levelStart);
    s.levelStart = st.levelStart;
    s.rng = seed >>> 0;
    s.tray = [];
    refill(s);
    return s;
  }
  function checkEnd(st) {
    if (st.score >= st.target) {
      st.phase = 'clear';
      st.picks = st.turnsLeft >= 5 ? 2 : 1;
      st.offers = makeOffers(st);
    } else if (st.turnsLeft <= 0) {
      st.phase = 'fail';
      st.endReason = 'turns';
    } else {
      let any = false;
      for (let x = 0; x < W; x++) if (canPlace(st, x)) any = true;
      if (!any) { st.phase = 'fail'; st.endReason = 'full'; }
    }
  }
  function consume(st, id) {
    const idx = new Set(atomsFor(st, id));
    st.tray = st.tray.filter((_, i) => !idx.has(i));
  }
  /** 執行一個動作；回傳 {steps,total,depth,...}，不合法則回傳 null */
  function act(st, a) {
    if (st.phase !== 'play') return null;
    let res;
    if (a.type === 'place') {
      if (!candidates(st).includes(a.cid) || !canPlace(st, a.x)) return null;
      consume(st, a.cid);
      const cell = place(st, a.cid, a.x);
      const afterPlace = snap(st);
      res = resolve(st);
      res.afterPlace = afterPlace;
      res.found.push(a.cid);
      res.placed = { id: cell.id, c: a.cid, x: a.x };
      st.turnsLeft--;
      refill(st);
    } else if (a.type === 'temp') {
      const nt = st.T + a.dir;
      if (nt < 0 || nt >= TEMPS.length || st.charges.temp <= 0) return null;
      st.charges.temp--;
      st.T = nt;
      res = resolve(st);
    } else if (a.type === 'spark') {
      if (st.charges.spark <= 0 || !sparkable(st)) return null;
      st.charges.spark--;
      res = resolve(st, { spark: true });
    } else if (a.type === 'redraw') {
      if (st.charges.redraw <= 0) return null;
      st.charges.redraw--;
      st.tray = [];
      refill(st);
      res = { steps: [], total: 0, depth: 0, found: [], foundRx: [] };
    } else return null;
    st.score += res.total;
    for (const s of res.steps) if (s.logs) for (const l of s.logs) st.log.unshift(l);

    st.best.chain = Math.max(st.best.chain, res.depth);
    st.best.turn = Math.max(st.best.turn, res.total);
    checkEnd(st);
    return res;
  }
  /** 預覽：在副本上試放，回傳得分與落點 */
  function simulatePlace(st, cid, x) {
    if (!canPlace(st, x)) return null;
    const s = { grid: st.grid.map((c) => c.slice()), T: st.T, up: st.up, uid: st.uid, relics: st.relics };
    const cell = place(s, cid, x);
    const landing = posOf(s, cell.id);
    // 落點旁邊有幾個同種分子（鋪陳用）
    let adj = 0;
    for (const [dx, dy] of DIRS) {
      const nx = landing[0] + dx, ny = landing[1] + dy;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const b = s.grid[nx][ny];
      if (b && b.c === cid) adj++;
    }
    const r = resolve(s);
    return { total: r.total, depth: r.depth, landing, adj, events: eventsOf(r) };
  }
  const eventsOf = (r) => r.steps.flatMap((q) => q.logs || []);
  function simulateAction(st, a) {
    const s = JSON.parse(JSON.stringify({ ...st, levelStart: null }));
    const r = act(s, a);
    return r ? { total: r.total, depth: r.depth, events: eventsOf(r) } : null;
  }

  /** 下一步建議：能馬上得分的放法／工具 > 鋪陳（湊成一對）> 從頭開始 */
  function hint(st) {
    if (st.phase !== 'play') return null;
    const cands = candidates(st);
    let best = null, setup = null;
    for (const cid of cands) {
      for (let x = 0; x < W; x++) {
        const r = simulatePlace(st, cid, x);
        if (!r) continue;
        if (r.total > 0) { if (!best || r.total > best.total) best = { kind: 'place', cid, x, ...r }; }
        else if (r.adj > 0) {
          const v = value(st, cid) * (1 + r.adj);
          if (!setup || v > setup.v) setup = { kind: 'setup', cid, x, v, ...r };
        }
      }
    }
    let tool = null;
    const tools = [];
    if (st.charges.spark > 0 && sparkable(st)) tools.push({ type: 'spark' });
    if (st.charges.temp > 0) { if (st.T < TEMPS.length - 1) tools.push({ type: 'temp', dir: 1 }); if (st.T > 0) tools.push({ type: 'temp', dir: -1 }); }
    for (const a of tools) {
      const r = simulateAction(st, a);
      if (r && r.total > 0 && (!tool || r.total > tool.total)) tool = { kind: 'tool', action: a, ...r };
    }
    // 工具不花回合：只要不比最好的放法差太多就先建議工具
    if (tool && (!best || tool.total >= best.total * 0.8)) return tool;
    if (best) return best;
    if (setup) return setup;
    // 從頭開始：挑「價值 × 之後還容易再做出來」最高的分子
    let tot = 0;
    for (const e of st.unlocked) tot += st.bag[e] || 0;
    let pick = null, ps = -1;
    for (const cid of cands) {
      let p = Math.pow(value(st, cid), 1.5);
      for (const e in C[cid].counts) p *= Math.pow((st.bag[e] || 0) / tot, C[cid].counts[e]);
      if (p > ps) { ps = p; pick = cid; }
    }
    if (!pick) return null;
    let x = 0;
    for (let k = 0; k < W; k++) if (canPlace(st, k) && colItems(st, k).length < colItems(st, x).length) x = k;
    return { kind: 'start', cid: pick, x };
  }

  // ---------------------------------------------------------------- 補給站
  function makeOffers(st) {
    const locked = UNLOCK_ORDER.filter((e) => !st.unlocked.includes(e));
    const offers = locked.slice(0, 2).map((e) => ({ type: 'element', e }));
    const pool = [];
    if (st.traySize < TRAY_MAX) pool.push({ type: 'tray' }, { type: 'tray' });
    pool.push({ type: 'temp' }, { type: 'spark' }, { type: 'redraw' }, { type: 'undo' });
    for (const e of st.unlocked) pool.push({ type: 'upgrade', e }, { type: 'upgrade', e }, { type: 'enrich', e });
    for (const r in RELICS) if (!has(st, r)) pool.push({ type: 'relic', r }, { type: 'relic', r });
    const same = (p, o) => p.type === o.type && p.e === o.e && p.r === o.r;
    while (offers.length < 4 && pool.length) {
      const o = pool.splice(Math.floor(rand(st) * pool.length), 1)[0];
      if (!offers.some((p) => same(p, o))) offers.push(o);
    }
    return offers;
  }
  function takeOffer(st, idx) {
    if (st.phase !== 'clear' || !st.offers || !st.offers[idx] || st.picks <= 0) return false;
    const o = st.offers[idx];
    if (o.type === 'element') { st.unlocked.push(o.e); st.bag[o.e] = ELEMENTS[o.e].w; (st.newEls = st.newEls || []).push(o.e); }
    else if (o.type === 'tray') st.traySize = Math.min(TRAY_MAX, st.traySize + 1);
    else if (o.type === 'temp') st.max.temp++;
    else if (o.type === 'spark') st.max.spark++;
    else if (o.type === 'redraw') st.max.redraw++;
    else if (o.type === 'undo') st.max.undo++;
    else if (o.type === 'upgrade') st.up[o.e] = (st.up[o.e] || 0) + 1;
    else if (o.type === 'enrich') st.bag[o.e] = (st.bag[o.e] || 0) + 2;
    else if (o.type === 'relic') { if (!st.relics) st.relics = []; if (!st.relics.includes(o.r)) st.relics.push(o.r); }
    st.offers.splice(idx, 1);
    st.picks--;
    return true;
  }
  function nextLevel(st) {
    st.level++;
    st.unlocked.sort((a, b) => ELEMENTS[a].z - ELEMENTS[b].z);
    startLevel(st);
  }

  /** 某物質參與的反應（只列出元素都已解鎖的） */
  function reactionsOf(id, unlocked) {
    const ok = (f) => C[f].els.every((e) => !unlocked || unlocked.includes(e));
    return RX.filter((r) => (r.a === id || r.b === id) && ok(r.a) && ok(r.b));
  }

  return {
    VERSION, W, H, TRAY_START, TRAY_MAX, TURNS, BASE_MAX,
    ELEMENTS, START_ELEMENTS, UNLOCK_ORDER, TEMPS, ROOM, C, RX, PAIR, RELICS, ACID_KINDS,
    parseFormula, fText, fHTML, balance, equation, rxEquation, decEquation,
    phaseAt, value, upMult, targetFor, setTarget: (b, g) => { TARGET_BASE = b; TARGET_GROWTH = g; },
    candidates, atomsFor, canPlace, sparkable, rxActive, colItems, posOf,
    newRun, startLevel, retryLevel, act, resolve, simulatePlace, simulateAction, hint,
    makeOffers, takeOffer, nextLevel, reactionsOf, rand,
  };
})();
if (typeof module !== 'undefined') module.exports = Lab;

</script>
<script>
/* 夜間實驗室 — 畫面與操作 */
(() => {
  'use strict';
  const L = Lab;
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => [...document.querySelectorAll(s)];
  const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const SAVE = 'nightlab.v1';
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DUR = RM ? { move: 60, flash: 80, pop: 60, gap: 40 } : { move: 260, flash: 300, pop: 220, gap: 150 };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const PHN = { s: '固態', l: '液態', g: '氣態' };
  const TCOL = ['#c6e8ff', '#94d2ff', '#78c4ff', '#9fe3c4', '#ffb547', '#ff8a3d', '#ff4d2e'];
  const newSeed = () => (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;

  let st = null, meta = null, sel = null, busy = false, undo = [], inspectId = null, shownScore = 0, cell = 60;
  let tut = null, lastHint = null, pulseX = null;
  const tiles = new Map();

  // ------------------------------------------------------------ 顏色、字級
  const EC = (e) => L.ELEMENTS[e].color;
  function lum(hex) {
    const n = parseInt(hex.slice(1), 16);
    const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
    return 0.2126 * f((n >> 16) & 255) + 0.7152 * f((n >> 8) & 255) + 0.0722 * f(n & 255);
  }
  const inkFor = (hex) => (lum(hex) > 0.33 ? '#121822' : '#ffffff');
  const byZ = (a, b) => L.ELEMENTS[a].z - L.ELEMENTS[b].z;
  const compStyle = (id) => { const c = L.C[id]; return `--c1:${EC(c.c1)};--c2:${EC(c.c2)};--ink:${inkFor(EC(c.c1))};--fs:${fsFor(id)}`; };
  const atomStyle = (e) => `--c:${EC(e)};--ink:${inkFor(EC(e))}`;
  function fsFor(id) {
    const w = id.replace(/\d/g, '').length + (id.match(/\d/g) || []).length * 0.6;
    return w <= 2.2 ? 0.34 : w <= 3.4 ? 0.3 : w <= 4.6 ? 0.25 : w <= 6 ? 0.21 : w <= 8 ? 0.175 : 0.15;
  }
  function tileInner(id) {
    const dots = L.C[id].els.slice().sort(byZ).map((e) => `<i style="background:${EC(e)}"></i>`).join('');
    return `<div class="body"><span class="f">${L.fHTML(id)}</span><span class="dots">${dots}</span></div>`;
  }
  const fmtT = (t) => (t === Infinity ? '—' : `${t} °C`);

  // ------------------------------------------------------------ 存檔
  function save() { try { localStorage.setItem(SAVE, JSON.stringify({ st, meta })); } catch (e) { /* 私密模式等 */ } }
  function load() { try { const r = localStorage.getItem(SAVE); return r ? JSON.parse(r) : null; } catch (e) { return null; } }

  // ------------------------------------------------------------ 版面
  function layout() {
    const vw = document.documentElement.clientWidth, vh = window.innerHeight;
    const wide = vw >= 960 && vh >= 540;
    document.documentElement.dataset.layout = wide ? 'wide' : 'narrow';
    const cs = getComputedStyle(document.documentElement);
    const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    let c;
    if (wide) {
      const bar = $('.bar').getBoundingClientRect().height;
      const coach = $('#coach').hidden ? 0 : $('#coach').getBoundingClientRect().height + 10;
      const availH = vh - padY - bar - coach - 10 - 26 - 28 - 12 - 40 - 6;
      const availW = Math.min(1440, vw) - 32 - 96 - 28 - 380 - 34 - 20;
      c = Math.min(availH / 9, availW / 7, 86);
    } else {
      const availW = vw - 32 - 34 - 22;
      c = Math.min(availW / 7, Math.max(40, (vh - padY - 620) / 9), 86);
    }
    cell = Math.max(34, Math.floor(c));
    document.documentElement.style.setProperty('--cell', cell + 'px');
    buildTicks();
    for (const [, el] of tiles) { el.classList.add('instant'); posTile(el, +el.dataset.x, +el.dataset.y); }
    requestAnimationFrame(() => { for (const [, el] of tiles) el.classList.remove('instant'); });
    renderPreview();
  }
  function buildTicks() {
    let html = '';
    for (let r = 0; r <= L.H; r++) {
      const y = (L.H - r) * cell;
      const long = r % 2 === 0;
      html += `<i class="${long ? 'l' : ''}" style="top:${y}px"></i>`;
      if (long && r > 0) html += `<span style="top:${y}px">${r * 25}</span>`;
    }
    $('#ticks').innerHTML = html + '<em>mL</em>';
  }
  function buildScale() {
    const ol = $('#scale');
    ol.querySelectorAll('li').forEach((li) => li.remove());
    for (let i = L.TEMPS.length - 1; i >= 0; i--) {
      const T = L.TEMPS[i];
      const li = h('li', '', `<span class="t">${T.t}°</span><span class="n">${T.name}</span>`);
      li.dataset.i = i;
      li.style.setProperty('--tc', TCOL[i]);
      ol.appendChild(li);
    }
  }

  // ------------------------------------------------------------ 燒杯
  function posTile(el, x, y) { el.style.transform = `translate(${x * cell}px, ${y * cell}px)`; }
  function clearTiles() { for (const [, el] of tiles) el.remove(); tiles.clear(); }
  function renderGrid(grid, opt = {}) {
    const layer = $('#tiles');
    const alive = new Set();
    for (let x = 0; x < L.W; x++) {
      for (let y = 0; y < L.H; y++) {
        const c = grid[x][y];
        if (!c) continue;
        alive.add(c.id);
        let el = tiles.get(c.id);
        const ph = L.phaseAt(c.c, st.T);
        if (!el) {
          el = h('div', 'tile instant', tileInner(c.c));
          el.dataset.id = c.id;
          el.style.cssText = compStyle(c.c);
          el.dataset.phase = ph;
          tiles.set(c.id, el);
          layer.appendChild(el);
          if (opt.drop === c.id) {
            posTile(el, x, -1.3);
            el.getBoundingClientRect();
            el.classList.remove('instant');
            posTile(el, x, y);
          } else {
            el.classList.add('enter');
            posTile(el, x, y);
            el.getBoundingClientRect();
            el.classList.remove('instant');
            requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('enter')));
          }
        } else {
          el.dataset.phase = ph;
          posTile(el, x, y);
        }
        el.dataset.x = x;
        el.dataset.y = y;
      }
    }
    for (const [id, el] of tiles) {
      if (!alive.has(id)) {
        tiles.delete(id);
        el.classList.add('gone');
        setTimeout(() => el.remove(), 380);
      }
    }
  }
  function refreshPhases() { for (const [, el] of tiles) { const c = st.grid[+el.dataset.x] && st.grid[+el.dataset.x][+el.dataset.y]; if (c) el.dataset.phase = L.phaseAt(c.c, st.T); } }

  function fxBurst(fx) {
    const layer = $('#fx');
    for (const f of fx) {
      const el = h('div', 'fx fx-' + f.type);
      el.style.transform = `translate(${f.x * cell}px, ${f.y * cell}px)`;
      layer.appendChild(el);
      setTimeout(() => el.remove(), 750);
    }
  }
  function popScore(s) {
    if (!s.fx.length || !s.gain) return;
    const cx = s.fx.reduce((a, f) => a + f.x, 0) / s.fx.length + 0.5;
    const cy = s.fx.reduce((a, f) => a + f.y, 0) / s.fx.length + 0.5;
    const el = h('div', 'pop', `+${s.gain}${s.mult > 1 ? `<i>×${s.mult}</i>` : ''}`);
    el.style.left = cx * cell + 'px';
    el.style.top = cy * cell - 12 + 'px';
    $('#fx').appendChild(el);
    setTimeout(() => el.remove(), 1050);
  }
  function banner(text) {
    const el = h('div', 'banner', text);
    $('#beaker').appendChild(el);
    setTimeout(() => el.remove(), 950);
  }

  // ------------------------------------------------------------ 畫面各區
  function renderHeader() {
    $('#lvNum').textContent = st.level;
    $('#els').innerHTML = st.unlocked.slice().sort(byZ).map((e) => `<i style="${atomStyle(e)}" title="${L.ELEMENTS[e].zh}">${e}</i>`).join('');
    $('#score').textContent = shownScore;
    $('#target').textContent = st.target;
    $('#meter').style.width = Math.min(100, (shownScore / st.target) * 100) + '%';
    $('#turns').textContent = st.turnsLeft;
    $('#turnsBox').classList.toggle('low', st.turnsLeft <= 3);
  }
  function renderThermo() {
    const i = st.T;
    $$('#scale li').forEach((li) => li.classList.toggle('on', +li.dataset.i === i));
    $('#scale').style.setProperty('--tc', TCOL[i]);
    $('#merc').style.height = `calc(${((i + 0.5) / L.TEMPS.length) * 100}% - 6px)`;
    $('#tN').textContent = st.charges.temp;
    const play = st.phase === 'play';
    $('#heat').disabled = !play || st.charges.temp <= 0 || i >= L.TEMPS.length - 1;
    $('#cool').disabled = !play || st.charges.temp <= 0 || i <= 0;
    $('#vesselArea').dataset.temp = i;
    $('#srcLabel').textContent = `${L.TEMPS[i].name} ${L.TEMPS[i].t} °C`;
  }
  function renderTray() {
    const use = sel ? new Set(L.atomsFor(st, sel)) : null;
    const box = $('#tray');
    box.classList.toggle('dim', !!use);
    box.innerHTML = st.tray.map((e, i) => `<span class="atom${use && use.has(i) ? ' use' : ''}" style="${atomStyle(e)}" title="${L.ELEMENTS[e].zh}">${e}</span>`).join('');
    $('#trayHint').textContent = `${st.tray.length} 個原子`;
  }
  function renderCands() {
    const list = L.candidates(st);
    if (sel && !list.includes(sel)) sel = null;
    const box = $('#cands');
    if (!list.length) { box.innerHTML = '<div class="empty">合成不出東西了，試試重抽。</div>'; return; }
    box.innerHTML = list.map((id) => {
      const ph = L.phaseAt(id, st.T);
      return `<button class="cand${sel === id ? ' on' : ''}" type="button" data-id="${id}" style="${compStyle(id)}" aria-pressed="${sel === id}">` +
        `<span class="sw" data-phase="${ph}"></span><span class="cf">${L.fHTML(id)}</span><span class="cv">${L.value(st, id)}</span>` +
        `<span class="cn">${L.C[id].zh}</span><span class="cp">${PHN[ph]}</span></button>`;
    }).join('');
  }
  function renderTools() {
    const play = st.phase === 'play';
    $('#spark b').textContent = st.charges.spark;
    $('#spark').disabled = !play || st.charges.spark <= 0 || !L.sparkable(st);
    $('#redraw b').textContent = st.charges.redraw;
    $('#redraw').disabled = !play || st.charges.redraw <= 0;
    $('#undo b').textContent = st.charges.undo;
    $('#undo').disabled = !play || !undo.length || st.charges.undo <= 0;
  }
  function condLabel(rx) {
    if (rx.cond === 'auto') return ['相鄰即反應', 'auto'];
    if (rx.cond === 'spark') return ['火花／光照', 'spark'];
    if (rx.cond === 'burn') return [`火花，或 ≥${L.C[rx.a].ai} °C 自燃`, 'burn'];
    return [`≥${rx.cond} °C`, 'heat'];
  }
  function logItem(l) {
    const g = `<span class="g">+${l.gain}${l.mult > 1 ? `<i>×${l.mult}</i>` : ''}</span>`;
    const vent = l.vent && l.vent.length ? ` <small>（${l.vent.map(L.fHTML).join('、')} 逸出）</small>` : '';
    if (l.k === 'rx') { const rx = L.RX[l.i]; return `<li><span class="k">${rx.kind}</span><span class="eq">${L.rxEquation(rx, true)}${vent}</span>${g}</li>`; }
    if (l.k === 'dec') return `<li><span class="k">熱分解</span><span class="eq">${L.decEquation(l.c, true)}${vent}</span>${g}</li>`;
    return `<li><span class="k">收集</span><span class="eq">${L.fHTML(l.c)} ×${l.n} <small>${L.C[l.c].zh}</small></span>${g}</li>`;
  }
  function renderLog() {
    $('#log').innerHTML = st.log.length ? st.log.map(logItem).join('') : '<li class="empty" style="display:block;border:0">還沒有反應。把 3 個相同的分子連在一起，或讓會反應的分子靠在一起。</li>';
  }
  function compoundFacts(id) {
    const c = L.C[id];
    const f = [];
    if (c.mp === c.bp) f.push(`昇華點 <b>${fmtT(c.mp)}</b>`);
    else { f.push(`熔點 <b>${fmtT(c.mp)}</b>`); f.push(`沸點 <b>${fmtT(c.bp)}</b>`); }
    if (c.dec) f.push(`<b>≥${c.dec.t} °C</b> 分解`);
    if (c.ai != null) f.push(`自燃 <b>${c.ai} °C</b>`);
    f.push(`價值 <b>${L.value(st, id)}</b>`);
    return f.map((x) => `<span>${x}</span>`).join('');
  }
  function renderInspect() {
    const box = $('#inspect');
    $$('.tile.sel').forEach((e) => e.classList.remove('sel'));
    const pos = inspectId != null ? L.posOf(st, inspectId) : null;
    if (!pos) { box.hidden = true; inspectId = null; return; }
    const id = st.grid[pos[0]][pos[1]].c, c = L.C[id];
    const t = tiles.get(inspectId);
    if (t) t.classList.add('sel');
    const ph = L.phaseAt(id, st.T);
    const rxs = L.reactionsOf(id, st.unlocked);
    let list = rxs.map((rx) => { const [lab, cls] = condLabel(rx); return `<li><span class="eq">${L.rxEquation(rx, true)}</span><span class="cond ${cls}">${lab}</span></li>`; });
    if (c.dec) list.unshift(`<li><span class="eq">${L.decEquation(id, true)}</span><span class="cond heat">≥${c.dec.t} °C 熱分解</span></li>`);
    box.innerHTML = `<button class="btn close" type="button" id="inspClose" aria-label="關閉">✕</button>
      <h3><span class="fm">${L.fHTML(id)}</span>${c.zh}</h3>
      <div class="facts"><span>現在是 <b>${PHN[ph]}</b></span>${compoundFacts(id)}</div>
      ${list.length ? `<ul class="rxlist">${list.slice(0, 14).join('')}</ul>` : '<div class="hint">以目前解鎖的元素，沒有會和它反應的物質。</div>'}
      ${c.simp ? '<p class="hint">這個分解產物為遊戲簡化。</p>' : ''}`;
    box.hidden = false;
    $('#inspClose').onclick = () => { inspectId = null; renderInspect(); };
  }
  function renderPreview() {
    const bad = $('#badges'), gh = $('#ghosts');
    bad.innerHTML = '';
    gh.innerHTML = '';
    const on = sel && st && st.phase === 'play';
    for (let x = 0; x < L.W; x++) {
      const b = h('div', 'badge');
      b.dataset.x = x;
      if (on) {
        const p = L.simulatePlace(st, sel, x);
        if (!p) { b.classList.add('full'); b.textContent = '滿'; }
        else {
          b.textContent = p.total > 0 ? '+' + p.total : '0';
          if (p.total > 0) b.classList.add('pos');
          if (p.depth >= 2) b.dataset.chain = p.depth;
          const g = h('div', 'ghost', '<div class="body"></div>');
          g.dataset.x = x;
          g.style.transform = `translate(${p.landing[0] * cell}px, ${p.landing[1] * cell}px)`;
          gh.appendChild(g);
        }
      }
      else { b.textContent = x + 1; b.classList.add('num'); }
      bad.appendChild(b);
    }
  }
  function hoverCol(x) {
    const hi = $('#hiLayer');
    hi.innerHTML = '';
    if (pulseX != null) { const p = h('div', 'colpulse'); p.style.left = pulseX * cell + 'px'; hi.appendChild(p); }
    $$('.ghost').forEach((g) => g.classList.toggle('hot', x != null && +g.dataset.x === x));
    if (x == null) return;
    const c = h('div', 'colhi');
    c.style.left = x * cell + 'px';
    hi.appendChild(c);
  }
  function renderAll() {
    renderHeader(); renderThermo(); renderTray(); renderCands(); renderTools(); renderLog();
    renderGrid(st.grid); renderPreview(); renderInspect(); markTiles(); renderCoach();
  }

  // ------------------------------------------------------------ 下一步提示
  const FM = (f) => `<b class="fm">${L.fHTML(f)}</b>`;
  const rich = (t) => t.replace(/\{([^}]+)\}/g, (_, f) => FM(f));
  function why(ev) {
    if (!ev) return '會得分';
    if (ev.k === 'cl') return `湊成 ${ev.n} 個 ${FM(ev.c)} 相連，收集`;
    if (ev.k === 'dec') return `${FM(ev.c)} 受熱分解`;
    const rx = L.RX[ev.i];
    return `${FM(rx.a)} 和 ${FM(rx.b)} 會${rx.cond === 'burn' ? '燃燒' : '反應'}（${rx.kind}）`;
  }
  function hintHTML(hn) {
    const pts = `<span class="pts">+${hn.total}</span>`;
    const chain = hn.depth >= 2 ? `，還會連鎖 ${hn.depth} 段` : '';
    switch (hn.kind) {
      case 'place': return `把 ${FM(hn.cid)} 放在第 <b>${hn.x + 1}</b> 欄：${why(hn.events[0])}${chain}，${pts}。`;
      case 'tool': {
        const a = hn.action;
        const what = a.type === 'spark' ? '按「火花」' : a.dir > 0 ? `加熱到 ${L.TEMPS[st.T + 1].t} °C` : `冷卻到 ${L.TEMPS[st.T - 1].t} °C`;
        return `${what}：${why(hn.events[0])}${chain}，${pts}（不花回合）。`;
      }
      case 'setup': return `把 ${FM(hn.cid)} 放在第 <b>${hn.x + 1}</b> 欄，和旁邊的 ${FM(hn.cid)} 湊成一對，之後再補一個就能收集。`;
      default: return `先放一個 ${FM(hn.cid)}（${L.C[hn.cid].zh}），之後在它旁邊再放兩個，3 個相連就會收集得分。`;
    }
  }
  function renderCoach() {
    const box = $('#coach');
    const off = !st || meta.hint === false || st.phase !== 'play';
    if (box.hidden !== off) { box.hidden = off; requestAnimationFrame(layout); }
    if (off) return;
    $('#coachNeed').textContent = `還差 ${Math.max(0, st.target - shownScore)} 分 · 剩 ${st.turnsLeft} 回合`;
    const show = $('#coachShow');
    if (tut) { $('#coachText').textContent = '跟著橘色的說明一步一步做。'; show.hidden = true; return; }
    if (sel) {
      $('#coachText').innerHTML = `${FM(sel)} 會落在虛線框的位置。<span class="k-match">白框</span>是同種分子（3 個相連就收集），<span class="k-partner">橘框</span>是會和它反應的分子；燒杯上方是馬上會得到的分數。`;
      show.hidden = true;
      return;
    }
    lastHint = L.hint(st);
    $('#coachText').innerHTML = lastHint ? hintHTML(lastHint) : '合成不出東西了，按「重抽」換一批原子。';
    show.hidden = !lastHint;
  }
  function flashPulse(el) { if (!el) return; el.classList.add('pulse'); setTimeout(() => el.classList.remove('pulse'), 2600); }
  function showHint() {
    const hn = lastHint;
    if (!hn || busy) return;
    if (hn.kind === 'tool') { flashPulse($(hn.action.type === 'spark' ? '#spark' : hn.action.dir > 0 ? '#heat' : '#cool')); return; }
    selectCand(hn.cid);
    pulseX = hn.x;
    hoverCol(null);

  function markTiles() {

  // ------------------------------------------------------------ 新手教學（第一關）
  const TUT = [

  function tutShake() { const b = $('#tut'); if (!b) return; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
  function colRect(x) {
    const r = $('#badges').getBoundingClientRect();
    const t = $('#tiles').getBoundingClientRect();
    return { left: t.left + x * cell, width: cell, top: r.top, bottom: r.bottom, height: r.height };
  }
  function placeBubble(el, rect, prefer) {
    const bw = el.offsetWidth, bh = el.offsetHeight, m = 12;
    const fitsBelow = rect.bottom + bh + m <= innerHeight - 8, fitsAbove = rect.top - bh - m >= 8;
    let side = prefer || 'below';
    if (side === 'below' && !fitsBelow) side = fitsAbove ? 'above' : 'right';
    else if (side === 'above' && !fitsAbove) side = fitsBelow ? 'below' : 'right';
    el.dataset.side = side;
    if (side === 'right') {
      // 目標太高（例如溫度計）：放在旁邊
      const left = Math.min(innerWidth - bw - 12, rect.left + rect.width + m);
      const top = Math.max(8, Math.min(innerHeight - bh - 8, rect.top + rect.height / 2 - bh / 2));
      el.style.left = Math.max(12, left) + 'px';
      el.style.top = top + 'px';
      el.style.setProperty('--ay', Math.max(14, Math.min(bh - 28, rect.top + rect.height / 2 - top - 7)) + 'px');
      return;
    }
    const top = side === 'below' ? rect.bottom + m : rect.top - bh - m;
    const cx = rect.left + rect.width / 2;
    const left = Math.max(12, Math.min(innerWidth - bw - 12, cx - bw / 2));
    el.style.top = Math.max(8, top) + 'px';
    el.style.left = left + 'px';
    el.style.setProperty('--ax', Math.max(14, Math.min(bw - 28, cx - left - 7)) + 'px');
  }

  // ------------------------------------------------------------ 每關開場：新元素可以試什麼

    Ca: ['生石灰 {CaO} 遇水變成 {Ca(OH)2}；{Ca(OH)2} 遇到 {CO2} 會生成 {CaCO3}（石灰水變混濁）。', '電石 {CaC2} 遇水會產生乙炔 {C2H2}。', '{CaCO3} 加熱到 900 °C 會分解成 {CaO} 和 {CO2}。'],
  };
  const tipOk = (t) => [...t.matchAll(/\{([^}]+)\}/g)].every((m) => L.C[m[1]] && L.C[m[1]].els.every((e) => st.unlocked.includes(e)));
  function openIntro() {

    }).join('');
    showOverlay(`<h2>第 ${st.level} 關</h2><p class="sub">目標 <b>${st.target}</b> 分，${st.turnsLeft} 回合。上方的提示列會告訴你下一步可以怎麼做。</p>${blocks}<div class="acts"><button class="btn primary" type="button" id="introGo">開始</button></div>`);

  // ------------------------------------------------------------ 第一次用到某功能時的小提示

  function discover(res) {

  function offerView(o) {
    const atom = (e) => `<span class="atom bigatom" style="${atomStyle(e)}">${e}</span>`;

    switch (o.type) {
      case 'element': {
        const after = st.unlocked.concat(o.e);
        const n = Object.values(L.C).filter((c) => c.els.includes(o.e) && c.els.every((e) => after.includes(e))).length;
        return ['新元素', `${atom(o.e)}${E.zh}`, `原子序 ${E.z}。加入元素袋，馬上多出 ${n} 種含${E.zh}的物質可以合成。`];
      }

  function openShop() {

  function openBook(tab = 'mol') {

    const all = Object.values(L.C).slice().sort((a, b) => {

      return za - zb || a.n - b.n;

    let body;
    if (tab === 'mol') {
      body = `<div class="legend"><span><i style="background:#8aa0bf"></i>固</span><span><i style="background:#4fb3ff"></i>液</span><span><i style="background:#ffd27a"></i>氣</span><span><i style="background:#c79bff"></i>分解</span><span>（由左到右：${L.TEMPS.map((t) => t.t).join('、')} °C）</span></div><div class="book">` +
        all.map((c) => {
          const dots = c.els.slice().sort(byZ).map((e) => `<i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${EC(e)};margin-right:2px"></i>`).join('');
          if (!found.has(c.id)) return `<div class="bcard locked"><span class="fm">？？？</span><span class="nm">${dots} ${c.n} 個原子</span></div>`;
          const phases = L.TEMPS.map((T, i) => `<i class="${c.dec && T.t >= c.dec.t ? 'x' : L.phaseAt(c.id, i)}"></i>`).join('');
          return `<div class="bcard"><span class="fm">${L.fHTML(c.id)}</span><span class="nm">${c.zh}</span><span class="phases">${phases}</span></div>`;
        }).join('') + '</div>';
    } else {
      const items = meta.rx.map((k) => {
        if (k.startsWith('dec:')) { const id = k.slice(4); return `<li><span class="eq">${L.decEquation(id, true)}</span><span class="meta"><span class="cond heat">≥${L.C[id].dec.t} °C 熱分解</span></span></li>`; }
        const rx = rxByKey(k);
        if (!rx) return '';
        const [lab, cls] = condLabel(rx);
        return `<li><span class="eq">${L.rxEquation(rx, true)}</span><span class="meta"><span>${rx.kind}</span><span class="cond ${cls}">${lab}</span>${rx.note ? `<span>${rx.note}</span>` : ''}</span></li>`;
      });
      body = items.length ? `<ul class="rxbook">${items.join('')}</ul>` : '<p class="hint">還沒發現任何反應。</p>';
    }
    showOverlay(`<h2>圖鑑</h2><div class="tabs"><button type="button" data-tab="mol" class="${tab === 'mol' ? 'on' : ''}">物質 ${found.size}/${Object.keys(L.C).length}</button><button type="button" data-tab="rx" class="${tab === 'rx' ? 'on' : ''}">反應 ${meta.rx.length}/${nRx}</button></div>${body}
      <div class="acts"><button class="btn primary" type="button" id="bookClose">關閉</button></div>`);
    $$('.tabs button').forEach((b) => { b.onclick = () => openBook(b.dataset.tab); });
    $('#bookClose').onclick = hideOverlay;
  }

  // ------------------------------------------------------------ 動作
  async function animate(res, a) {
    busy = true;
    document.body.classList.add('busy');
    if (res.afterPlace) { renderGrid(res.afterPlace, { drop: res.placed.id }); await wait(DUR.move + 60); }
    if (a.type === 'temp') { renderThermo(); refreshPhases(); await wait(DUR.flash); }
    for (const s of res.steps) {
      if (s.kind === 'settle') { renderGrid(s.grid); await wait(DUR.move); continue; }
      fxBurst(s.fx);
      await wait(DUR.flash);
      renderGrid(s.grid);
      shownScore += s.gain;
      renderHeader();
      popScore(s);
      if (s.mult >= 2) banner(`連鎖 ×${s.mult}`);
      await wait(DUR.pop + DUR.gap);
    }
    shownScore = st.score;
    busy = false;
    document.body.classList.remove('busy');
  }
  async function doAction(a) {
    if (busy || !st || st.phase !== 'play') return;
    if (!tutAllows(a)) { tutShake(); return; }
    pulseX = null;
    const tipEl = $('#tip');
    if (tipEl) tipEl.remove();
    $$('.pulse').forEach((e) => e.classList.remove('pulse'));
    const before = JSON.stringify(st);
    const res = L.act(st, a);
    if (!res) return;
    undo.push(before);
    if (undo.length > 40) undo.shift();
    sel = null;
    inspectId = null;
    renderPreview();
    hoverCol(null);
    renderInspect();
    $$('.cand').forEach((b) => b.classList.remove('on'));
    save();
    await animate(res, a);
    discover(res);
    meta.best.chain = Math.max(meta.best.chain || 0, res.depth);
    if (tut && a.type === 'place') { tut.i++; tutTray(); }
    save();
    renderAll();
    if (tut) tutRender();
    if (st.phase === 'clear') { if (tut) tutEnd(); banner('過關！'); setTimeout(openShop, 800); }
    else if (st.phase === 'fail') setTimeout(openFail, 500);
    else firstTips();
  }
  function doUndo() {
    if (busy || tut || !undo.length || st.charges.undo <= 0 || st.phase !== 'play') return;
    const left = st.charges.undo - 1;
    st = JSON.parse(undo.pop());
    st.charges.undo = left;
    sel = null; inspectId = null; shownScore = st.score;
    clearTiles(); renderAll(); save();
  }
  function selectCand(id) {
    if (!tutAllows({ type: 'select', id })) { tutShake(); return; }
    if (id !== sel) pulseX = null;
    sel = id;
    $$('.cand').forEach((b) => { const on = b.dataset.id === id; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    inspectId = null;
    renderInspect(); renderTray(); renderPreview(); hoverCol(null); markTiles(); renderCoach();
    if (tut) { if (tut.i === 1 && id === 'H2O') tut.i = 2; tutRender(); }
  }
  function colAt(cx, cy) {
    const r = $('#tiles').getBoundingClientRect();
    if (cy < r.top - 48 || cy > r.bottom + 24) return null;
    const x = Math.floor((cx - r.left) / cell);
    return x >= 0 && x < L.W ? x : null;
  }

  function bindEvents() {
    // 可合成清單：點選或拖曳
    let drag = null;
    const cands = $('#cands');
    cands.addEventListener('pointerdown', (e) => {
      const b = e.target.closest('.cand');
      if (!b || busy || e.button > 0) return;
      drag = { id: b.dataset.id, x0: e.clientX, y0: e.clientY, moved: false, el: null, pid: e.pointerId, btn: b };
      try { b.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    });
    cands.addEventListener('pointermove', (e) => {
      if (!drag || e.pointerId !== drag.pid) return;
      if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 10) {
        drag.moved = true;
        selectCand(drag.id);
        drag.el = h('div', 'drag', tileInner(drag.id));
        drag.el.dataset.phase = L.phaseAt(drag.id, st.T);
        drag.el.style.cssText = compStyle(drag.id);
        document.body.appendChild(drag.el);
      }
      if (drag.moved) {
        drag.el.style.transform = `translate(${e.clientX - cell / 2}px, ${e.clientY - cell / 2}px)`;
        hoverCol(colAt(e.clientX, e.clientY));
      }
    });
    const endDrag = (e, cancel) => {
      if (!drag || e.pointerId !== drag.pid) return;
      const d = drag;
      drag = null;
      if (d.el) d.el.remove();
      hoverCol(null);
      if (cancel) return;
      if (!d.moved) { selectCand(sel === d.id ? null : d.id); return; }
      const x = colAt(e.clientX, e.clientY);
      if (x != null && L.canPlace(st, x)) doAction({ type: 'place', cid: d.id, x });
    };
    cands.addEventListener('pointerup', (e) => endDrag(e, false));
    cands.addEventListener('pointercancel', (e) => endDrag(e, true));
    cands.addEventListener('keydown', (e) => {
      const b = e.target.closest('.cand');
      if (b && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); selectCand(sel === b.dataset.id ? null : b.dataset.id); }
    });

    // 燒杯：放入或查看
    const beaker = $('#beaker');
    beaker.addEventListener('pointermove', (e) => { if (sel && !busy && e.pointerType === 'mouse') hoverCol(colAt(e.clientX, e.clientY)); });
    beaker.addEventListener('pointerleave', () => { if (!drag) hoverCol(null); });
    beaker.addEventListener('click', (e) => {
      if (busy || st.phase !== 'play') return;
      const x = colAt(e.clientX, e.clientY);
      if (sel) { if (x != null && L.canPlace(st, x)) doAction({ type: 'place', cid: sel, x }); return; }
      const t = e.target.closest('.tile');
      inspectId = t ? +t.dataset.id : null;
      renderInspect();
    });
    $('#badges').addEventListener('click', (e) => {
      const b = e.target.closest('.badge');
      if (b && sel && !busy && L.canPlace(st, +b.dataset.x)) doAction({ type: 'place', cid: sel, x: +b.dataset.x });
    });

    $('#heat').onclick = () => doAction({ type: 'temp', dir: +1 });
    $('#cool').onclick = () => doAction({ type: 'temp', dir: -1 });
    $('#spark').onclick = () => doAction({ type: 'spark' });
    $('#redraw').onclick = () => doAction({ type: 'redraw' });
    $('#undo').onclick = doUndo;
    $('#coachShow').onclick = showHint;
    window.addEventListener('scroll', () => tutPosition(), { passive: true });
    $('#btnHelp').onclick = () => openHelp(false);
    $('#btnBook').onclick = () => openBook('mol');
    $('#btnMenu').onclick = openMenu;
    $('#overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay' && st.phase === 'play') hideOverlay(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (!$('#overlay').hidden && st.phase === 'play') hideOverlay();
        else if (sel) selectCand(null);
        else if (inspectId != null) { inspectId = null; renderInspect(); }
      } else if (sel && /^[1-7]$/.test(e.key) && $('#overlay').hidden) {
        const x = +e.key - 1;
        if (L.canPlace(st, x)) doAction({ type: 'place', cid: sel, x });
      }
    });
    let rt = 0;
    window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { layout(); tutPosition(); }, 120); });
  }

  // ------------------------------------------------------------ 開始
  let started = false;
  function start(data) {
    if (started) return;
    started = true;
    const saved = data && data.st ? data : load();
    meta = (saved && saved.meta) || { found: [], rx: [], best: { level: 1, chain: 0 } };
    meta.best = meta.best || { level: 1, chain: 0 };
    st = saved && saved.st && saved.st.v === L.VERSION ? saved.st : L.newRun(newSeed());
    shownScore = st.score;
    buildScale();
    bindEvents();
    layout();
    renderAll();
    if (st.phase === 'clear') openShop();
    else if (st.phase === 'fail') openFail();
    else if (!meta.tut) {
      const fresh = st.level === 1 && st.score === 0 && st.turnsLeft === L.TURNS;
      if (!saved || fresh) { st = L.newRun(newSeed()); resetView(); tutStart(); }
      else {
        showOverlay(`<h2>新的教學</h2><p class="sub">加了一個 1 分鐘的互動教學，還有隨時告訴你下一步可以做什麼的提示列。要從第 1 關跟著教學玩一次嗎？</p>
          <div class="acts"><button class="btn" type="button" id="tNo">繼續目前這局</button><button class="btn primary" type="button" id="tYes">看教學（重新開始）</button></div>`);
        $('#tNo').onclick = () => { meta.tut = true; save(); hideOverlay(); };
        $('#tYes').onclick = () => { st = L.newRun(newSeed()); resetView(); tutStart(); };
      }
    }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layout());
  }
  window.claude?.hot?.snapshot?.(() => ({ st, meta }));
  if (window.claude?.hot?.ready) window.claude.hot.ready(start);
  else start(window.claude?.hot?.data ?? {});
})();

</script>
