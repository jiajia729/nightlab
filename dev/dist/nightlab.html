<title>夜間實驗室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
:root {
  /* 版面：左溫度計 · 中央量筒燒杯 · 右側反應台／可合成／紀錄；窄螢幕改成上下堆疊 */
  --bg: #060a13;
  --bg-glow: #0e1a33;
  --panel: #0b1322;
  --panel-hi: #111c31;
  --line: rgba(150, 188, 232, 0.13);
  --line-hi: rgba(150, 188, 232, 0.28);
  --glass: rgba(185, 222, 255, 0.42);
  --text: #e5ecf6;
  --dim: #93a4bb;
  --faint: #5b6b82;
  --amber: #ffb547; /* 鈉燈 589 nm：分數與選取 */
  --heat: #ff7a3d;
  --cold: #78c4ff;
  --good: #7fdcaa;
  --bad: #ff6b6b;
  --font-display: "LXGW WenKai TC", "Noto Serif TC", "Songti TC", serif;
  --font-ui: system-ui, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-data: "B612 Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-formula: "B612", "Noto Sans", system-ui, sans-serif;
  --cell: 60px;
  --move: 260ms;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(1100px 640px at 50% -12%, var(--bg-glow), transparent 70%),
    linear-gradient(rgba(150, 188, 232, 0.025) 1px, transparent 1px) 0 0 / 28px 28px,
    linear-gradient(90deg, rgba(150, 188, 232, 0.025) 1px, transparent 1px) 0 0 / 28px 28px,
    var(--bg);
  color: var(--text);
  font: 14px/1.5 var(--font-ui);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
sub { font-size: 0.7em; vertical-align: -0.25em; line-height: 0; }

.app {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-inline: 16px;
  padding-block: 10px 16px;
  max-width: 1440px;
  margin: 0 auto;
}
[data-layout="wide"] .app { height: 100%; min-height: 0; }

/* ------------------------------------------------------------ 頂列 */
.bar { display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; margin-right: 4px; }
.brand svg { width: 26px; height: 26px; color: var(--amber); }
.brand h1 { margin: 0; font: 700 22px/1 var(--font-display); letter-spacing: 0.06em; }
.lv { display: flex; align-items: baseline; gap: 8px; }
.lv b { font: 700 20px/1 var(--font-display); white-space: nowrap; }
.lv .lvt { font: 400 14px/1.2 var(--font-display); color: var(--dim); white-space: nowrap; }
.els { display: flex; gap: 4px; flex-wrap: wrap; }
.els i {
  font: 700 11px/18px var(--font-formula); font-style: normal; min-width: 18px; padding: 0 3px; text-align: center;
  border-radius: 9px; background: var(--c); color: var(--ink);
}
.goal { flex: 1 1 220px; min-width: 180px; display: grid; gap: 4px; }
.goal .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; color: var(--dim); font-size: 12px; }
.goal .row b { font: 700 18px/1 var(--font-data); color: var(--amber); }
.goal .row span.t { font: 400 13px/1 var(--font-data); color: var(--dim); }
.meter { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.06); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #c77a1b, var(--amber)); box-shadow: 0 0 10px rgba(255, 181, 71, 0.6); transition: width 400ms ease; }
.turns { text-align: center; line-height: 1.1; }
.turns b { display: block; font: 700 24px/1 var(--font-data); }
.turns span { font-size: 11px; color: var(--dim); }
.turns.low b { color: var(--bad); }
.nav { display: flex; gap: 6px; }
.btn {
  border: 1px solid var(--line-hi); background: var(--panel-hi); border-radius: 10px;
  padding: 7px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 38px;
}
.btn:hover { border-color: var(--glass); }
.btn:disabled { opacity: 0.38; cursor: default; }
.btn svg { width: 17px; height: 17px; }
.btn b { font: 700 13px/1 var(--font-data); color: var(--amber); }
.btn.primary { background: linear-gradient(180deg, #ffc15e, #f09a1c); color: #2a1702; border-color: transparent; font-weight: 700; }

/* ------------------------------------------------------------ 主舞台 */
.stage { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
[data-layout="wide"] .stage { flex: 1; min-height: 0; grid-template-columns: 96px auto minmax(0, 1fr); align-items: stretch; }

/* 溫度計 */
.thermo { display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
.tbtn {
  border: 1px solid var(--line-hi); background: var(--panel-hi); border-radius: 12px; padding: 8px 6px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; font-size: 13px;
}
.tbtn svg { width: 20px; height: 20px; }
.tbtn.hot { color: #ffb08a; }
.tbtn.cold { color: #a9d9ff; }
.tbtn:disabled { opacity: 0.35; cursor: default; }
.scale { list-style: none; margin: 0; padding: 6px 0 6px 18px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; position: relative; min-height: 0; }
.scale::before { /* 玻璃管 */
  content: ""; position: absolute; left: 6px; top: 4px; bottom: 4px; width: 6px; border-radius: 3px;
  background: rgba(255, 255, 255, 0.06); box-shadow: inset 0 0 0 1px var(--line-hi);
}
.scale .merc { position: absolute; left: 7px; bottom: 5px; width: 4px; border-radius: 2px; background: var(--tc); box-shadow: 0 0 8px var(--tc); transition: height 500ms ease, background 500ms ease; }
.scale li { position: relative; display: grid; line-height: 1.15; padding: 2px 0 2px 6px; border-radius: 6px; color: var(--faint); transition: color 300ms; }
.scale li .t { font: 700 12px/1.1 var(--font-data); }
.scale li .n { font-size: 11px; }
.scale li.on { color: var(--text); background: color-mix(in oklab, var(--tc) 18%, transparent); }
.scale li.on .t { color: var(--tc); }
.tcount { text-align: center; font-size: 11px; color: var(--dim); }
.tcount b { font: 700 13px/1 var(--font-data); color: var(--amber); }

[data-layout="narrow"] .thermo { flex-direction: row; align-items: center; }
[data-layout="narrow"] .tbtn { flex-direction: row; padding: 8px 10px; }
[data-layout="narrow"] .scale { flex-direction: row; padding: 0; gap: 3px; }
[data-layout="narrow"] .scale::before, [data-layout="narrow"] .scale .merc { display: none; }
[data-layout="narrow"] .scale li { flex: 1; text-align: center; padding: 4px 1px; justify-items: center; }
[data-layout="narrow"] .scale li .n { font-size: 10px; }
[data-layout="narrow"] .tcount { white-space: nowrap; }
[data-layout="narrow"] .scale li { min-width: 0; }
@media (max-width: 599px) {
  [data-layout="narrow"] .thermo { flex-wrap: wrap; justify-content: space-between; }
  [data-layout="narrow"] .tbtn.hot { order: 0; }
  [data-layout="narrow"] .tcount { order: 1; }
  [data-layout="narrow"] .tbtn.cold { order: 2; }
  [data-layout="narrow"] .scale { order: 3; flex: 1 1 100%; }
  [data-layout="narrow"] .scale li .n { font-size: 9px; }
}

/* 燒杯 */
.vessel-area { position: relative; display: flex; flex-direction: column; align-items: center; justify-self: center; padding-left: 34px; }
.badges { display: grid; grid-template-columns: repeat(7, var(--cell)); height: 24px; margin-bottom: 4px; padding-inline: 8px; }
.badge { text-align: center; font: 700 12px/22px var(--font-data); color: var(--faint); border-radius: 6px; margin: 0 3px; }
.badge.pos { color: #2a1702; background: var(--amber); box-shadow: 0 0 10px rgba(255, 181, 71, 0.45); }
.badge.full { color: var(--bad); font-family: var(--font-ui); }
.badge[data-chain]::after { content: "鏈" attr(data-chain); font-size: 9px; margin-left: 2px; vertical-align: 1px; }
.beaker {
  position: relative; width: calc(var(--cell) * 7 + 16px); height: calc(var(--cell) * 9 + 10px);
  padding: 0 8px 10px; border: 2px solid var(--glass); border-top: 0; border-radius: 0 0 28px 28px;
  background: linear-gradient(180deg, rgba(150, 200, 255, 0.025), rgba(150, 200, 255, 0.07));
  box-shadow: inset 0 0 44px rgba(120, 180, 255, 0.06), inset 7px 0 0 -5px rgba(255, 255, 255, 0.06);
  transition: box-shadow 500ms ease, background 500ms ease;
  touch-action: none;
}
.beaker::before, .beaker::after { /* 杯口 */
  content: ""; position: absolute; top: -2px; width: 12px; height: 2px; background: var(--glass);
}
.beaker::before { left: -12px; border-radius: 2px 0 0 2px; }
.beaker::after { right: -12px; }
.slots {
  position: absolute; left: 8px; top: 0; width: calc(var(--cell) * 7); height: calc(var(--cell) * 9);
  background-image: radial-gradient(circle at center, rgba(160, 200, 255, 0.10) 1.2px, transparent 1.6px);
  background-size: var(--cell) var(--cell);
}
.colhi { position: absolute; top: 0; width: var(--cell); height: calc(var(--cell) * 9); background: linear-gradient(180deg, rgba(255, 181, 71, 0.10), rgba(255, 181, 71, 0.03)); border-radius: 8px; pointer-events: none; }
.layer { position: absolute; left: 8px; top: 0; width: calc(var(--cell) * 7); height: calc(var(--cell) * 9); }
.layer { pointer-events: none; }
.layer .tile { pointer-events: auto; cursor: pointer; }
.ticks { position: absolute; left: -36px; top: 0; height: calc(var(--cell) * 9); width: 30px; pointer-events: none; }
.ticks i { position: absolute; right: 0; height: 1px; width: 8px; background: var(--glass); }
.ticks i.l { width: 14px; }
.ticks span { position: absolute; right: 16px; transform: translateY(-50%); font: 400 10px/1 var(--font-data); color: var(--faint); }
.ticks em { position: absolute; right: 0; bottom: -22px; font: 400 10px/1 var(--font-data); color: var(--faint); font-style: normal; }
.source { margin-top: 10px; height: 26px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: var(--dim); position: relative; width: 100%; }
.source .heat { width: 60%; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.05); transition: background 500ms, box-shadow 500ms; }

.vessel-area[data-temp="0"] .beaker { box-shadow: inset 0 0 50px rgba(180, 230, 255, 0.22), 0 0 34px rgba(150, 220, 255, 0.28); background: linear-gradient(180deg, rgba(200, 235, 255, 0.10), rgba(150, 210, 255, 0.10)); }
.vessel-area[data-temp="1"] .beaker { box-shadow: inset 0 0 44px rgba(140, 200, 255, 0.16), 0 0 22px rgba(120, 190, 255, 0.16); }
.vessel-area[data-temp="2"] .beaker { box-shadow: inset 0 0 40px rgba(140, 200, 255, 0.10); }
.vessel-area[data-temp="4"] .heat { background: linear-gradient(90deg, #6b2a12, #ff7a3d, #6b2a12); box-shadow: 0 0 14px rgba(255, 122, 61, 0.55); }
.vessel-area[data-temp="5"] .heat { background: radial-gradient(60% 140% at 50% 100%, #8fd0ff, #3b6dff 55%, transparent 75%); box-shadow: 0 -6px 18px rgba(80, 140, 255, 0.55); }
.vessel-area[data-temp="5"] .beaker { box-shadow: inset 0 -30px 40px -20px rgba(255, 140, 60, 0.18); }
.vessel-area[data-temp="6"] .heat { background: linear-gradient(90deg, #7a1608, #ff5a1f, #ffcf6b, #ff5a1f, #7a1608); box-shadow: 0 0 22px rgba(255, 90, 31, 0.7); }
.vessel-area[data-temp="6"] .beaker { box-shadow: inset 0 0 50px rgba(255, 110, 40, 0.22), 0 0 30px rgba(255, 90, 31, 0.3); }

/* 分子方塊：固體＝晶體、液體＝水滴、氣體＝發光的氣泡 */
.tile { position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); padding: calc(var(--cell) * 0.055); transition: transform var(--move) cubic-bezier(0.25, 0.8, 0.25, 1); will-change: transform; }
.tile.instant { transition: none; }
.tile .body {
  width: 100%; height: 100%; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  transition: transform 220ms ease, opacity 220ms ease, border-radius 300ms ease;
}
.tile.enter .body { transform: scale(0.3); opacity: 0; }
.tile.gone .body { transform: scale(1.3); opacity: 0; }
.tile.sel .body { outline: 2px solid var(--amber); outline-offset: 2px; }
.tile .f { font: 700 calc(var(--cell) * var(--fs)) / 1 var(--font-formula); letter-spacing: -0.02em; white-space: nowrap; position: relative; }
.tile .dots { display: flex; gap: 2px; position: relative; }
.tile .dots i { width: calc(var(--cell) * 0.075); height: calc(var(--cell) * 0.075); border-radius: 50%; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35); }
[data-phase="s"] > .body, .sw[data-phase="s"] {
  border-radius: 7px; color: var(--ink);
  background: linear-gradient(150deg, color-mix(in oklab, var(--c1) 68%, white) 0%, var(--c1) 42%, color-mix(in oklab, var(--c1) 60%, black) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), inset 0 -3px 0 rgba(0, 0, 0, 0.28), 0 2px 6px rgba(0, 0, 0, 0.45);
}
[data-phase="s"] > .body::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(115deg, transparent 36%, rgba(255, 255, 255, 0.26) 37%, transparent 56%); pointer-events: none; }
[data-phase="l"] > .body, .sw[data-phase="l"] {
  border-radius: 44% 44% 48% 48% / 34% 34% 62% 62%; color: var(--ink);
  background: radial-gradient(110% 85% at 50% 18%, color-mix(in oklab, var(--c1) 55%, white) 0%, var(--c1) 48%, color-mix(in oklab, var(--c1) 55%, black) 100%);
  box-shadow: inset 0 -6px 10px rgba(0, 0, 0, 0.25), 0 3px 8px rgba(0, 0, 0, 0.4);
}
[data-phase="l"] > .body::before { content: ""; position: absolute; left: 24%; right: 24%; top: 8%; height: 11%; border-radius: 50%; background: rgba(255, 255, 255, 0.38); }
[data-phase="g"] > .body, .sw[data-phase="g"] {
  border-radius: 50%; color: color-mix(in oklab, var(--cg, var(--c1)) 30%, white);
  background: radial-gradient(circle at 50% 45%, color-mix(in oklab, var(--cg, var(--c1)) 42%, transparent) 0%, color-mix(in oklab, var(--cg, var(--c1)) 14%, transparent) 62%, transparent 72%);
  border: 1.5px solid color-mix(in oklab, var(--cg, var(--c1)) 78%, transparent);
  box-shadow: 0 0 calc(var(--cell) * 0.22) color-mix(in oklab, var(--cg, var(--c1)) 42%, transparent), inset 0 0 calc(var(--cell) * 0.18) color-mix(in oklab, var(--cg, var(--c1)) 30%, transparent);
}
.tile[data-phase="g"] > .body { animation: bob 2.6s ease-in-out infinite alternate; }
.tile[data-phase="g"]:nth-child(3n) > .body { animation-duration: 3.1s; }
.tile[data-phase="g"]:nth-child(3n + 1) > .body { animation-delay: -1.2s; }
@keyframes bob { from { translate: 0 -1.5px; } to { translate: 0 1.5px; } }
.ghost { position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); padding: calc(var(--cell) * 0.07); pointer-events: none; }
.ghost .body { width: 100%; height: 100%; border: 2px dashed rgba(255, 181, 71, 0.55); border-radius: 10px; background: rgba(255, 181, 71, 0.06); }
.ghost.hot .body { border-style: solid; border-color: var(--amber); background: rgba(255, 181, 71, 0.16); }

/* 特效 */
.fx { position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); pointer-events: none; }
.fx::before { content: ""; position: absolute; inset: 6%; border-radius: 50%; border: 3px solid var(--fxc); box-shadow: 0 0 18px var(--fxc), inset 0 0 12px var(--fxc); animation: ring 620ms ease-out forwards; }
.fx-react { --fxc: #ffd27a; }
.fx-burn { --fxc: #ff6a2b; }
.fx-collect { --fxc: #c8f6ff; }
.fx-decomp { --fxc: #c79bff; }
.fx-burn::after, .fx-collect::after {
  content: ""; position: absolute; inset: -10%; border-radius: 50%;
  background: radial-gradient(circle, var(--fxc) 0%, color-mix(in oklab, var(--fxc) 40%, transparent) 40%, transparent 70%);
  animation: flare 560ms ease-out forwards;
}
@keyframes ring { from { transform: scale(0.35); opacity: 1; } to { transform: scale(1.55); opacity: 0; } }
@keyframes flare { from { transform: scale(0.5); opacity: 0.95; } to { transform: scale(1.3); opacity: 0; } }
.pop { position: absolute; left: 0; top: 0; font: 700 19px/1 var(--font-data); color: var(--amber); text-shadow: 0 0 12px rgba(255, 181, 71, 0.7), 0 2px 2px #000; pointer-events: none; white-space: nowrap; animation: rise 1000ms ease-out forwards; z-index: 5; }
.pop i { font-style: normal; font-size: 13px; color: #fff; margin-left: 4px; }
@keyframes rise { 0% { opacity: 0; translate: -50% 4px; } 15% { opacity: 1; } 100% { opacity: 0; translate: -50% -46px; } }
.banner { position: absolute; left: 50%; top: 42%; translate: -50% -50%; pointer-events: none; font: 700 44px/1 var(--font-display); color: var(--amber); text-shadow: 0 0 22px rgba(255, 181, 71, 0.8), 0 3px 3px #000; white-space: nowrap; animation: bannerIn 900ms ease-out forwards; z-index: 6; }
@keyframes bannerIn { 0% { opacity: 0; scale: 0.6; } 20% { opacity: 1; scale: 1.08; } 70% { opacity: 1; scale: 1; } 100% { opacity: 0; scale: 1; } }

/* ------------------------------------------------------------ 右側 */
.side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
[data-layout="wide"] .side { min-height: 0; }
.panel { background: color-mix(in oklab, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.panel > header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.panel h2 { margin: 0; font: 700 16px/1.2 var(--font-display); letter-spacing: 0.04em; }
.hint { font-size: 12px; color: var(--dim); }

.tray { display: flex; flex-wrap: wrap; gap: 6px; }
.atom {
  width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; position: relative;
  font: 700 15px/1 var(--font-formula); color: var(--ink);
  background: radial-gradient(circle at 34% 30%, color-mix(in oklab, var(--c) 35%, white) 0%, var(--c) 42%, color-mix(in oklab, var(--c) 52%, black) 100%);
  box-shadow: 0 3px 6px rgba(0, 0, 0, 0.5), inset 0 -2px 3px rgba(0, 0, 0, 0.25);
  transition: transform 160ms ease, opacity 160ms ease, box-shadow 160ms ease;
}
.atom.use { transform: translateY(-4px); box-shadow: 0 0 0 2px var(--amber), 0 6px 12px rgba(0, 0, 0, 0.5); }
.tray.dim .atom:not(.use) { opacity: 0.45; }

[data-layout="wide"] .candp { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.cands { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; overflow-y: auto; align-content: start; padding: 2px; }
[data-layout="wide"] .cands { flex: 1; min-height: 0; }
.cand {
  display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; grid-template-rows: auto auto; column-gap: 8px; align-items: center;
  text-align: left; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-hi); cursor: pointer;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.cand:hover { border-color: var(--line-hi); }
.cand.on { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber), 0 0 16px rgba(255, 181, 71, 0.25); background: color-mix(in oklab, var(--panel-hi) 85%, var(--amber)); }
.cand .sw { grid-row: 1 / 3; width: 30px; height: 30px; display: block; }
.cand .sw[data-phase="g"] { width: 28px; height: 28px; }
.cand .cf { font: 700 15px/1.1 var(--font-formula); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cand .cn { grid-column: 2; font: 400 12px/1.2 var(--font-display); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cand .cv { grid-column: 3; grid-row: 1; font: 700 14px/1 var(--font-data); color: var(--amber); text-align: right; }
.cand .cp { grid-column: 3; grid-row: 2; font-size: 11px; text-align: right; color: var(--dim); }
.empty { color: var(--dim); font-size: 13px; padding: 8px 2px; }

.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.tools .btn { flex: 1 1 0; justify-content: center; min-width: 96px; }
.tools .btn.spark { color: #ffe08a; }

[data-layout="wide"] .logp { flex: 0 0 auto; height: 28%; min-height: 130px; display: flex; flex-direction: column; position: relative; }
.logp { position: relative; }
.log { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: grid; gap: 4px; align-content: start; }
[data-layout="wide"] .log { flex: 1; min-height: 0; }
[data-layout="narrow"] .log { max-height: 220px; }
.log li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: baseline; font-size: 13px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
.log .k { font-size: 11px; color: var(--dim); white-space: nowrap; border: 1px solid var(--line-hi); border-radius: 6px; padding: 0 5px; }
.log .eq { font: 400 13px/1.35 var(--font-formula); overflow-wrap: anywhere; }
.log .eq small { color: var(--faint); font-family: var(--font-ui); }

    H2O: { ph: 'l', full: ['H2', 'O2'], keep: ['H2', 'O2'], note: '實際要加一點電解質（例如硫酸鈉）才導電' },

  // ---------------------------------------------------------------- 反應
  // addRx(a, b, 產物, 留下(≤2), 條件, 類別, 說明, 選項)
  // 條件：'auto' 相鄰就反應 | 數字 = 至少要這個溫度 | 'burn' 火花，或溫度 ≥ a 的自燃溫度 | 'spark' 只有火花（放電）
  //       'uv' 只有紫外燈 | 'cat' 沒有觸媒就不會發生
  // 選項：cat:[觸媒, 溫度] 有這種觸媒時在這個溫度就會發生；via: b 是不被消耗的觸媒（方程式寫在箭頭上）
  function reactions(addRx, C) {
    const burn = (fuel, prods, keep, note) => addRx(fuel, 'O2', prods, keep, 'burn', '燃燒', note);
    // 燃燒
    burn('H2', ['H2O'], ['H2O', 'H2O']);
    burn('C', ['CO2'], ['CO2']);
    for (const f of ['CH4', 'C2H6', 'C2H4', 'C2H2', 'C3H8', 'C4H10', 'CH3OH', 'HCHO', 'HCOOH', 'CH3CHO', 'CH3COOH', 'C2H5OH', 'C6H6', '(CH3)2CO', 'CH3COOC2H5', '(C2H5)2O']) {
      burn(f, ['CO2', 'H2O'], ['CO2', 'H2O']);
    }
    burn('CO', ['CO2'], ['CO2', 'CO2']);
    addRx('NH3', 'O2', ['NO', 'H2O'], ['NO', 'H2O'], 'cat', '奧士華法', '鉑銠網上約 900 °C 把氨氧化成 NO，是製硝酸的第一步', { cat: ['Pt', 350] });
    burn('NH3', ['N2', 'H2O'], ['N2', 'H2O']);
    burn('N2H4', ['N2', 'H2O'], ['N2', 'H2O'], '聯氨是火箭燃料');
    burn('H2S', ['SO2', 'H2O'], ['SO2', 'H2O']);
    burn('S', ['SO2'], ['SO2']);
    burn('CS2', ['CO2', 'SO2'], ['CO2', 'SO2']);
    burn('CH3Cl', ['CO2', 'H2O', 'HCl'], ['CO2', 'HCl']);
    burn('Na', ['Na2O'], ['Na2O']);
    burn('Li', ['Li2O'], ['Li2O']);
    burn('Mg', ['MgO'], ['MgO', 'MgO'], '發出刺眼的白光');
    burn('Ca', ['CaO'], ['CaO', 'CaO']);
    burn('Al', ['Al2O3'], ['Al2O3']);
    burn('Fe', ['Fe3O4'], ['Fe3O4'], '鋼絲絨在純氧中燃燒，火星四射');
    burn('Zn', ['ZnO'], ['ZnO']);
    burn('B', ['B2O3'], ['B2O3']);
    burn('P4', ['P4O10'], ['P4O10'], '白磷在空氣中約 34 °C 就會自燃，所以要泡在水裡保存');
    burn('P', ['P4O10'], ['P4O10']);
    burn('PH3', ['P4O10', 'H2O'], ['P4O10', 'H2O']);
    burn('SiH4', ['SiO2', 'H2O'], ['SiO2', 'H2O'], '矽烷一接觸空氣就自燃');
    burn('B2H6', ['B2O3', 'H2O'], ['B2O3', 'H2O']);
    addRx('Mg', 'CO2', ['MgO', 'C'], ['MgO', 'C'], 'burn', '燃燒', '鎂在二氧化碳中也能燃燒');
    addRx('Mg', 'N2', ['Mg3N2'], ['Mg3N2'], 'burn', '燃燒', '鎂在空氣中燃燒時，也會生成一些氮化鎂');
    addRx('Al', 'Fe2O3', ['Al2O3', 'Fe'], ['Al2O3', 'Fe'], 'burn', '鋁熱反應', '溫度超過 2500 °C，生成熔融的鐵，用來焊接鐵軌');
    addRx('Al', 'MnO2', ['Al2O3', 'Mn'], ['Al2O3', 'Mn'], 'burn', '鋁熱反應', '用來冶煉錳等高熔點金屬');
    // 放電、紫外光
    addRx('N2', 'O2', ['NO'], ['NO', 'NO'], 'spark', '放電固氮', '閃電就是這樣固定空氣中的氮');
    addRx('O2', 'O2', ['O3'], ['O3', 'O3'], 'spark', '放電', '臭氧產生器的原理');
    addRx('H2', 'Cl2', ['HCl'], ['HCl', 'HCl'], 'uv', '光照化合', '氫氯混合氣照光會爆炸');
    addRx('CH4', 'Cl2', ['CH3Cl', 'HCl'], ['CH3Cl', 'HCl'], 'uv', '光照取代', '自由基連鎖反應');
    addRx('CH3Cl', 'Cl2', ['CH2Cl2', 'HCl'], ['CH2Cl2', 'HCl'], 'uv', '光照取代');
    addRx('CH2Cl2', 'Cl2', ['CHCl3', 'HCl'], ['CHCl3', 'HCl'], 'uv', '光照取代');
    addRx('CHCl3', 'Cl2', ['CCl4', 'HCl'], ['CCl4', 'HCl'], 'uv', '光照取代');
    addRx('CH4', 'Br2', ['CH3Br', 'HBr'], ['CH3Br', 'HBr'], 'uv', '光照取代');
    addRx('NO2', 'O2', ['NO', 'O3'], ['NO', 'O3'], 'uv', '光化學煙霧', '汽機車排出的 NO₂ 在陽光下產生臭氧');

    for (const [m, x, p, k] of [['Na', 'Cl2', 'NaCl', 2], ['Na', 'F2', 'NaF', 2], ['K', 'Cl2', 'KCl', 2], ['Li', 'Cl2', 'LiCl', 2], ['Li', 'F2', 'LiF', 2], ['K', 'F2', 'KF', 2],
      ['Mg', 'F2', 'MgF2', 1], ['Ca', 'F2', 'CaF2', 1], ['Na', 'Br2', 'NaBr', 2], ['K', 'Br2', 'KBr', 2], ['B', 'F2', 'BF3', 1], ['Si', 'F2', 'SiF4', 1]]) {

    // 金屬、氫化物、碳化物、氮化物與水
    for (const [m, oh] of [['Li', 'LiOH'], ['Na', 'NaOH'], ['K', 'KOH'], ['Ca', 'Ca(OH)2'], ['Ba', 'Ba(OH)2']]) {

    for (const [h, oh] of [['NaH', 'NaOH'], ['CaH2', 'Ca(OH)2'], ['LiH', 'LiOH']]) addRx(h, 'H2O', [oh, 'H2'], [oh, 'H2'], 'auto', '氫化物水解');
    addRx('LiAlH4', 'H2O', ['LiOH', 'Al(OH)3', 'H2'], ['Al(OH)3', 'H2'], 'auto', '氫化物水解', '有機化學常用的強還原劑，遇水劇烈反應');
    addRx('NaBH4', 'H2O', ['NaBO2', 'H2'], ['NaBO2', 'H2'], 'auto', '氫化物水解', '實際在中性水中很慢，加酸或觸媒才快');
    addRx('CaC2', 'H2O', ['C2H2', 'Ca(OH)2'], ['Ca(OH)2', 'C2H2'], 'auto', '電石水解', '電石燈的原理');
    addRx('Al4C3', 'H2O', ['Al(OH)3', 'CH4'], ['Al(OH)3', 'CH4'], 'auto', '碳化物水解');
    addRx('Mg3N2', 'H2O', ['Mg(OH)2', 'NH3'], ['Mg(OH)2', 'NH3'], 'auto', '氮化物水解');
    addRx('Li3N', 'H2O', ['LiOH', 'NH3'], ['LiOH', 'NH3'], 'auto', '氮化物水解');
    addRx('CaCN2', 'H2O', ['CaCO3', 'NH3'], ['CaCO3', 'NH3'], 'auto', '水解', '氰氨化鈣是早期的氮肥');
    // 氧化物與水
    for (const [o, oh] of [['Li2O', 'LiOH'], ['Na2O', 'NaOH'], ['K2O', 'KOH'], ['CaO', 'Ca(OH)2'], ['BaO', 'Ba(OH)2']]) addRx(o, 'H2O', [oh], o === 'CaO' || o === 'BaO' ? [oh] : [oh, oh], 'auto', '氧化物與水', o === 'CaO' ? '生石灰遇水放熱' : '');

    if (t < c.bp) return 'l';
    return 'g';
  }
  const upMult = (st, e) => 1 + 0.5 * ((st.up && st.up[e]) || 0);
  /** 分子價值 = 原子底分總和 ×（越大的分子加成越多）× 每個已強化元素的倍率 */
  function value(st, id) {
    const c = C[id];
    let s = 0, m = 1;
    for (const e in c.counts) s += c.counts[e] * ELEMENTS[e].base;
    for (const e of c.els) m *= upMult(st, e);
    return Math.max(1, Math.round(s * (1 + 0.15 * (c.n - 1)) * m));
  }
  let TARGET_BASE = 60, TARGET_GROWTH = 1.17;
  function targetFor(level) { return Math.round(TARGET_BASE * Math.pow(TARGET_GROWTH, level - 1) / 5) * 5; }

  // ---------------------------------------------------------------- 亂數、元素袋、反應台
  function rand(st) {
    let t = (st.rng = (st.rng + 0x6d2b79f5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  /** 故事模式：反應台上每種元素最多放「允許的分子裡最多需要幾個」，避免用不到的原子塞滿反應台 */
  function atomCap(st) {
    if (st._cap) return st._cap;
    const cap = {};
    for (const id of st.only || ALL_IDS) {
      const c = C[id];
      if (c.n > st.traySize || !c.els.every((e) => st.unlocked.includes(e))) continue;
      for (const e in c.counts) cap[e] = Math.max(cap[e] || 0, c.counts[e]);
    }
    Object.defineProperty(st, '_cap', { value: cap, enumerable: false, configurable: true });
    return cap;
  }
  function drawAtom(st) {
    if (st.mode === 'story') {
      const cap = atomCap(st);
      for (let k = 0; k < 12; k++) {
        const e = drawRaw(st);
        if (st.tray.filter((x) => x === e).length < (cap[e] || 0)) return e;
      }
    }
    return drawRaw(st);
  }
  function drawRaw(st) {
    let tot = 0;
    for (const e of st.unlocked) tot += st.bag[e] || 0;
    let r = rand(st) * tot;
    for (const e of st.unlocked) { r -= st.bag[e] || 0; if (r < 0) return e; }
    return st.unlocked[st.unlocked.length - 1];
  }
  function trayCounts(tray) { const m = {}; for (const e of tray) m[e] = (m[e] || 0) + 1; return m; }
  const ALL_IDS = Object.keys(C);
  /** 現在可以放進燒杯的分子 */
  function candidates(st) {
    if (st.mode === 'sandbox') return ALL_IDS.slice();
    if (st.hand) {
      const seen = [];
      for (const id of st.hand) if (!seen.includes(id)) seen.push(id);
      return seen;
    }
    const have = trayCounts(st.tray);
    const out = [];
    for (const id of st.only || ALL_IDS) {
      const c = C[id];
      if (c.n > st.traySize) continue;
      let ok = true;
      for (const e in c.counts) if (!st.unlocked.includes(e) || (have[e] || 0) < c.counts[e]) { ok = false; break; }
      if (ok) out.push(id);
    }
    out.sort((a, b) => value(st, b) - value(st, a) || C[a].n - C[b].n || (a < b ? -1 : 1));
    return out;
  }
  const sortTray = (st) => st.tray.sort((a, b) => ELEMENTS[a].z - ELEMENTS[b].z);
  function refill(st) {
    if (st.hand || st.mode === 'sandbox') return;
    for (let tries = 0; tries < 30; tries++) {
      while (st.tray.length < st.traySize) st.tray.push(drawAtom(st));
      sortTray(st);
      if (candidates(st).length) return;
      st.tray = []; // 完全合成不出東西 → 免費重抽
    }
  }
  /** 這個分子會用掉反應台上的哪幾格（index） */
  function atomsFor(st, id) {
    if (!st.tray || st.hand || st.mode === 'sandbox') return [];
    const need = { ...C[id].counts };
    const idx = [];
    st.tray.forEach((e, i) => { if (need[e] > 0) { need[e]--; idx.push(i); } });
    return idx;
  }

  // ---------------------------------------------------------------- 燒杯
  const colItems = (st, x) => st.grid[x].filter(Boolean);
  function settleCol(st, x) {
    const items = colItems(st, x);
    const gas = [], cond = [];
    for (const c of items) (phaseAt(c.c, st.T) === 'g' ? gas : cond).push(c);
    const col = new Array(H).fill(null);
    gas.forEach((c, i) => { col[i] = c; });
    cond.forEach((c, i) => { col[H - cond.length + i] = c; });
    let moved = false;
    for (let i = 0; i < H; i++) if (col[i] !== st.grid[x][i]) moved = true;
    st.grid[x] = col;
    return moved;
  }
  function settle(st) { let m = false; for (let x = 0; x < W; x++) m = settleCol(st, x) || m; return m; }
  const canPlace = (st, x) => x >= 0 && x < W && colItems(st, x).length < H;
  function place(st, id, x) {
    const items = colItems(st, x);
    const nGas = items.filter((c) => phaseAt(c.c, st.T) === 'g').length;
    const cell = { id: st.uid++, c: id };
    items.splice(nGas, 0, cell); // 氣體疊在既有氣體下方；液固體疊在既有液固體上方
    st.grid[x] = items.concat(new Array(H - items.length).fill(null));
    settleCol(st, x);
    return cell;
  }
  const snap = (st) => st.grid.map((col) => col.map((c) => (c ? { id: c.id, c: c.c } : null)));
  function posOf(st, id) {
    for (let x = 0; x < W; x++) for (let y = 0; y < H; y++) if (st.grid[x][y] && st.grid[x][y].id === id) return [x, y];
    return null;
  }
  const emptyGrid = () => Array.from({ length: W }, () => new Array(H).fill(null));
  function countIn(st, id) { let n = 0; for (let x = 0; x < W; x++) for (let y = 0; y < H; y++) if (st.grid[x][y] && (id == null || st.grid[x][y].c === id)) n++; return n; }

  // ---------------------------------------------------------------- 反應判定
  /** flags: {spark, uv} */
  function rxActive(st, rx, flags = {}) {
    const t = TEMPS[st.T].t;
    let ok = false;
    if (rx.cat && st.cats && st.cats.includes(rx.cat.k) && t >= rx.cat.t) ok = true;
    else if (rx.cond === 'auto') ok = true;
    else if (rx.cond === 'spark') ok = !!flags.spark;
    else if (rx.cond === 'uv') ok = !!flags.uv;
    else if (rx.cond === 'burn') ok = !!flags.spark || (C[rx.a].ai != null && t >= C[rx.a].ai);
    else if (typeof rx.cond === 'number') ok = t >= rx.cond;
    if (!ok) return false;
    // 產物在這個溫度會分解 → 平衡往回，不反應（例如高溫下 N₂ + H₂ 不會生成 NH₃）
    for (const p of rx.full) if (C[p].dec && t >= C[p].dec.t) return false;
    return true;
  }
  function activeRx(st, a, b, flags) {
    const list = PAIR.get(a + '|' + b);
    if (!list) return null;
    for (const r of list) if (rxActive(st, r.rx, flags)) return r;
    return null;
  }
  const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
  function findReactions(st, flags) {
    const used = new Set(), out = [];
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const a = st.grid[x][y];
        if (!a || used.has(a.id)) continue;
        for (const [dx, dy] of DIRS) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
          const b = st.grid[nx][ny];
          if (!b || used.has(b.id)) continue;
          const r = activeRx(st, a.c, b.c, flags);
          if (!r) continue;
          used.add(a.id); used.add(b.id);
          out.push(r.flip ? { rx: r.rx, A: [nx, ny, b], B: [x, y, a] } : { rx: r.rx, A: [x, y, a], B: [nx, ny, b] });
          break;
        }
      }
    }
    return out;
  }
  function pairWith(st, test) {
    for (let x = 0; x < W; x++) {
      for (let y = 0; y < H; y++) {
        const a = st.grid[x][y];
        if (!a) continue;
        for (const [dx, dy] of DIRS.slice(0, 2)) {
          const nx = x + dx, ny = y + dy;
          if (nx >= W || ny >= H) continue;
          const b = st.grid[nx][ny];
          if (b && test(a.c, b.c)) return true;
        }
      }
    }
    return false;
  }
  /** 按火花會不會有事發生 */
  function sparkable(st) {
    return pairWith(st, (a, b) => !activeRx(st, a, b, {}) && !!activeRx(st, a, b, { spark: true }));
  }
  function uvable(st) {
    for (let x = 0; x < W; x++) for (let y = 0; y < H; y++) if (st.grid[x][y] && C[st.grid[x][y].c].pho) return true;
    return pairWith(st, (a, b) => !activeRx(st, a, b, {}) && !!activeRx(st, a, b, { uv: true }));
  }
  function findDecomps(st) {
    const t = TEMPS[st.T].t, out = [];
    for (let x = 0; x < W; x++) for (let y = 0; y < H; y++) {
      const a = st.grid[x][y];
      if (a && C[a.c].dec && t >= C[a.c].dec.t) out.push([x, y, a]);
    }
    return out;
  }
  function findClusters(st) {
    const seen = new Set(), groups = [];
    for (let x = 0; x < W; x++) {
      for (let y = 0; y < H; y++) {
        const a = st.grid[x][y];
        if (!a || seen.has(a.id)) continue;
        const group = [], stack = [[x, y]];
        seen.add(a.id);
        while (stack.length) {
          const [cx, cy] = stack.pop();
          group.push([cx, cy, st.grid[cx][cy]]);
          for (const [dx, dy] of DIRS) {
            const nx = cx + dx, ny = cy + dy;
            if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
            const b = st.grid[nx][ny];
            if (b && b.c === a.c && !seen.has(b.id)) { seen.add(b.id); stack.push([nx, ny]); }
          }
        }
        if (group.length >= 3) groups.push(group);
      }
    }
    return groups;
  }

  // ---------------------------------------------------------------- 結算（連鎖）
  function newTally() { return { made: {}, coll: {}, fl: {} }; }
  const bump = (m, id, n = 1) => { m[id] = (m[id] || 0) + n; };
  /** 一格變成兩個產物：第一個留在原位，第二個插在它後面（同一欄）；放不下就逸出 */
  function splitCells(st, items, tally, found) {
    // items: [[x, y, keep0, keep1]]；回傳逸出的產物
    const extra = new Map();
    const vented = [];
    for (const [x, y, k0, k1] of items) {
      const p0 = { id: st.uid++, c: k0 };
      st.grid[x][y] = p0;
      bump(tally.made, k0); found.add(k0);
      if (k1) extra.set(p0, k1);
    }
    for (let x = 0; x < W; x++) {
      const its = colItems(st, x);
      const out = [];
      for (const c of its) {
        out.push(c);
        if (extra.has(c)) out.push({ id: st.uid++, c: extra.get(c), pending: true });
      }
      while (out.length > H) {
        const i = out.findIndex((c) => c.pending);
        vented.push(out.splice(i, 1)[0].c);
      }
      for (const c of out) if (c.pending) { delete c.pending; bump(tally.made, c.c); found.add(c.c); }
      st.grid[x] = out.concat(new Array(H - out.length).fill(null));
    }
    return vented;
  }
  /** opts: spark, uv, depth（起始連鎖段數）, tally */
  function resolve(st, opts = {}) {
    const steps = [];
    const found = new Set(), foundRx = new Set();
    const tally = opts.tally || newTally();
    let depth = opts.depth || 0, total = 0;
    let flags = { spark: !!opts.spark, uv: !!opts.uv };
    const newCell = (id) => { found.add(id); bump(tally.made, id); return { id: st.uid++, c: id }; };
    if (settle(st)) steps.push({ kind: 'settle', grid: snap(st) });
    // 0. 照光分解
    if (flags.uv) {
      const items = [], fx = [], logs = [];
      let gain = 0;
      for (let x = 0; x < W; x++) for (let y = 0; y < H; y++) {
        const a = st.grid[x][y];
        if (!a || !C[a.c].pho) continue;
        const p = C[a.c].pho;
        items.push([x, y, p.keep[0], p.keep[1]]);
        const g = Math.round(value(st, a.c) * 0.75) * Math.min(64, 2 ** depth);
        gain += g;
        fx.push({ x, y, type: 'uv' });
        logs.push({ k: 'pho', c: a.c, gain: g, mult: Math.min(64, 2 ** depth), vent: [] });
        foundRx.add('pho:' + a.c);
      }
      if (items.length) {
        const v = splitCells(st, items, tally, found);
        if (v.length) logs[0].vent = v;
        settle(st);
        total += gain;
        steps.push({ kind: 'pho', fx, gain, mult: Math.min(64, 2 ** depth), grid: snap(st), logs });
        depth++;
      }
    }
    for (let wave = 0; wave < 60; wave++) {
      const mult = Math.min(64, 2 ** depth);
      // 1. 熱分解
      const dec = findDecomps(st);
      if (dec.length) {
        let gain = 0;
        const fx = [], logs = [], items = [];
        for (const [x, y, a] of dec) {
          const d = C[a.c].dec;
          items.push([x, y, d.keep[0], d.keep[1]]);
          const g = Math.round(value(st, a.c) * 0.5 * (has(st, 'furnace') ? 2 : 1)) * mult;
          gain += g;
          fx.push({ x, y, type: 'decomp' });
          logs.push({ k: 'dec', c: a.c, gain: g, mult, vent: [] });
          foundRx.add('dec:' + a.c);
        }
        const v = splitCells(st, items, tally, found);
        for (const c of v) { const lg = logs.find((l) => C[l.c].dec.keep[1] === c) || logs[0]; lg.vent.push(c); }
        settle(st);
        total += gain;
        steps.push({ kind: 'decomp', fx, gain, mult, grid: snap(st), logs });
        depth++;
        continue;
      }
      // 2. 相鄰反應
      const rxs = findReactions(st, flags);
      flags = {};
      if (rxs.length) {
        let gain = 0;
        const fx = [], logs = [];
        for (const { rx, A, B } of rxs) {
          let rm = 2;
          if (ACID_KINDS.has(rx.kind) && has(st, 'buret')) rm *= 2;
          if (rx.cond === 'burn' && has(st, 'lighter')) rm *= 2;
          if (typeof rx.cond === 'number' && has(st, 'furnace')) rm *= 2;
          const vb = rx.via ? 0 : value(st, B[2].c);
          const g = Math.round((value(st, A[2].c) + vb) * rm) * mult;
          gain += g;
          st.grid[A[0]][A[1]] = rx.keep[0] ? newCell(rx.keep[0]) : null;
          if (rx.via) { /* 觸媒留在原位 */ } else st.grid[B[0]][B[1]] = rx.keep[1] ? newCell(rx.keep[1]) : null;
          const t = rx.cond === 'burn' ? 'burn' : PRECIP.has(rx.keep[0]) || PRECIP.has(rx.keep[1]) ? 'precip' : 'react';
          fx.push({ x: A[0], y: A[1], type: t }, { x: B[0], y: B[1], type: t });
          logs.push({ k: 'rx', i: rx.i, gain: g, mult, vent: rx.full.filter((p) => !rx.keep.includes(p)) });
          foundRx.add(rx.key);
        }
        total += gain;
        steps.push({ kind: 'react', fx, gain, mult, grid: snap(st), logs });
        if (settle(st)) steps.push({ kind: 'settle', grid: snap(st) });
        depth++;
        continue;
      }
      // 3. 同種收集
      const groups = findClusters(st);
      if (groups.length) {
        let gain = 0;
        const fx = [], logs = [];
        for (const g of groups) {
          const n = g.length, id = g[0][2].c;
          const ph = phaseAt(id, st.T);
          const rel = (ph === 'l' && has(st, 'condenser')) || (ph === 'g' && has(st, 'gasjar')) || (ph === 's' && has(st, 'mortar')) ? 2 : 1;
          const pts = Math.round(value(st, id) * n * (1 + 0.5 * (n - 3)) * rel) * mult;
          gain += pts;
          for (const [x, y] of g) { st.grid[x][y] = null; fx.push({ x, y, type: 'collect' }); }
          logs.push({ k: 'cl', c: id, n, gain: pts, mult });
          bump(tally.coll, id, n);
        }
        total += gain;
        steps.push({ kind: 'cluster', fx, gain, mult, grid: snap(st), logs });
        if (settle(st)) steps.push({ kind: 'settle', grid: snap(st) });
        depth++;
        continue;
      }
      break;
    }
    return { steps, total, depth, found: [...found], foundRx: [...foundRx], tally };
  }

  // ---------------------------------------------------------------- 儀器動作
  function liquidRuns(st, x) {
    // 由下往上，液體段落（同種相連為一層）
    const runs = [];
    for (let y = H - 1; y >= 0; y--) {
      const c = st.grid[x][y];
      if (!c || phaseAt(c.c, st.T) !== 'l') continue;
      const last = runs[runs.length - 1];
      if (last && last.c === c.c && last.ys[last.ys.length - 1] === y + 1) last.ys.push(y);
      else runs.push({ c: c.c, ys: [y] });
    }
    return runs;
  }
  function canElectro(st, id) {
    const e = ELEC[id];
    if (!e) return false;
    if (e.ph && phaseAt(id, st.T) !== e.ph) return false;
    if (e.minT != null && TEMPS[st.T].t < e.minT) return false;
    return true;
  }
  /** 執行儀器的第一步；不會有效果就回傳 null */
  function toolStep(st, a, tally) {
    const k = a.k, x = a.x;
    const fx = [], logs = [];
    let gain = 0;
    const found = new Set(), foundRx = new Set();
    const removeCells = (cells, mult, kind) => {
      const by = {};
      for (const [cx, cy, c] of cells) { st.grid[cx][cy] = null; fx.push({ x: cx, y: cy, type: kind }); bump(by, c.c); }
      for (const id in by) {
        const g = Math.round(value(st, id) * by[id] * mult);
        gain += g;
        bump(tally.coll, id, by[id]);
        logs.push({ k: 'tool', t: k, c: id, n: by[id], gain: g, mult: 1 });
      }
    };
    const inCol = (pred) => { const out = []; for (let y = 0; y < H; y++) { const c = st.grid[x][y]; if (c && pred(c)) out.push([x, y, c]); } return out; };
    const inAll = (pred) => { const out = []; for (let cx = 0; cx < W; cx++) for (let y = 0; y < H; y++) { const c = st.grid[cx][y]; if (c && pred(c)) out.push([cx, y, c]); } return out; };
    const needCol = TOOLS[k] && TOOLS[k].aim === 'col';
    if (needCol && (x == null || x < 0 || x >= W)) return null;
    switch (k) {
      case 'distill': {
        const liq = inCol((c) => phaseAt(c.c, st.T) === 'l');
        if (!liq.length) return null;
        const low = liq.reduce((m, [, , c]) => (C[c.c].bp < C[m].bp ? c.c : m), liq[0][2].c);
        removeCells(liq.filter(([, , c]) => c.c === low), 1.5, 'distill');
        break;
      }
      case 'rotavap': {
        const liq = inAll((c) => phaseAt(c.c, st.T) === 'l' && C[c.c].bp < 100);
        if (!liq.length) return null;
        removeCells(liq, 1.2, 'distill');
        break;
      }
      case 'filter': {
        const sol = inCol((c) => phaseAt(c.c, st.T) === 's');
        if (!sol.length) return null;
        removeCells(sol, 1.2, 'filter');
        break;
      }
      case 'dry': {
        const w = inAll((c) => c.c === 'H2O');
        if (!w.length) return null;
        removeCells(w, 0.5, 'filter');
        break;
      }
      case 'flame': {
        const f = inCol((c) => C[c.c].flame.length > 0);
        if (!f.length) return null;
        for (const [cx, cy, c] of f) { st.grid[cx][cy] = null; fx.push({ x: cx, y: cy, type: 'flame', color: FLAME[C[c.c].flame[0]][0] }); }
        const by = {};
        for (const [, , c] of f) bump(by, c.c);
        for (const id in by) {
          const g = Math.round(value(st, id) * by[id] * 2);
          gain += g;
          bump(tally.coll, id, by[id]);
          logs.push({ k: 'tool', t: k, c: id, n: by[id], gain: g, mult: 1, flame: C[id].flame[0] });
          for (const e of C[id].flame) bump(tally.fl, e);
          foundRx.add('flame:' + C[id].flame[0]);
        }
        break;
      }
      case 'funnel': {
        const runs = liquidRuns(st, x);
        if (runs.length < 2) return null;
        const bot = runs[0], top = runs[runs.length - 1];
        // 把這欄液體重新排：最下層和最上層互換
        const liqYs = runs.flatMap((r) => r.ys).sort((p, q) => q - p); // 由下往上
        const order = [top, ...runs.slice(1, -1), bot];
        const cells = order.flatMap((r) => r.ys.map((y) => st.grid[x][y]));
        liqYs.forEach((y, i) => { st.grid[x][y] = cells[i]; fx.push({ x, y, type: 'react' }); });
        logs.push({ k: 'tool', t: k, c: top.c, c2: bot.c, gain: 0, mult: 1 });
        break;
      }
      case 'centri': {
        const ys = [], cells = [];
        for (let y = H - 1; y >= 0; y--) { const c = st.grid[x][y]; if (c && phaseAt(c.c, st.T) !== 'g') { ys.push(y); cells.push(c); } }
        if (cells.length < 2) return null;
        const sorted = cells.slice().sort((p, q) => C[q.c].d - C[p.c].d);
        if (sorted.every((c, i) => c === cells[i])) return null;
        ys.forEach((y, i) => { st.grid[x][y] = sorted[i]; fx.push({ x, y, type: 'react' }); });
        logs.push({ k: 'tool', t: k, gain: 0, mult: 1 });
        break;
      }
      case 'electro': {
        const el = inCol((c) => canElectro(st, c.c));
        if (!el.length) return null;
        // 陰極產物留在原位；陽極氣體（Cl₂、O₂）在另一極被收集走，不會馬上又和金屬反應回去
        for (const [cx, cy, c] of el) {
          const e = ELEC[c.c];
          st.grid[cx][cy] = { id: st.uid++, c: e.keep[0] };
          bump(tally.made, e.keep[0]); found.add(e.keep[0]);
          bump(tally.made, e.keep[1]); bump(tally.coll, e.keep[1]); found.add(e.keep[1]);
          fx.push({ x: cx, y: cy, type: 'zap' });
          const g = Math.round(value(st, c.c) + value(st, e.keep[1]));
          gain += g;
          logs.push({ k: 'el', c: c.c, gain: g, mult: 1, out: e.keep[1] });

        if (!a.cat || !CATALYSTS[a.cat] || (st.cats || []).includes(a.cat)) return null;

        logs.push({ k: 'tool', t: k, cat: a.cat, gain: 0, mult: 1 });

    settle(st);
    return { step: { kind: 'tool', tool: k, fx, gain, mult: 1, grid: snap(st), logs }, gain, found, foundRx };

  // ---------------------------------------------------------------- 關卡狀態
  function baseState(mode, seed) {
    return {
      v: VERSION, mode, rng: seed >>> 0, uid: 1, T: ROOM, temps: ALL_TEMPS.slice(), cats: [], catsAvail: [],
      unlocked: [], bag: {}, up: {}, traySize: TRAY_START, tray: [], hand: null, only: null, relics: [],

  /** 故事關卡。def 見 levels.js */

    st.unlocked = Object.keys(def.bag || {}).sort((a, b) => ELEMENTS[a].z - ELEMENTS[b].z);
    st.traySize = def.tray || TRAY_START;

    st.catsAvail = (def.cats || []).slice();
    st.cats = (def.cats0 || []).slice();
    st.only = def.only ? def.only.slice() : null;
    st.hand = def.hand ? def.hand.slice() : null;
    st.goals = def.goals.map((g) => ({ ...g }));
    st.starRules = (def.stars || []).map((g) => ({ ...g }));

  function newSandbox() {

  }
  // 無限挑戰（v1 玩法）
  function newRun(seed) {
    const st = baseState('endless', seed);
    st.level = 1;
    st.unlocked = START_ELEMENTS.slice();

  function startLevel(st) {

    return s;

  // ---------------------------------------------------------------- 目標、星星
  /** 回傳 [目前, 需要] */
  function goalProgress(st, g) {
    switch (g.t) {

      case 'make': return [Math.min(g.n, st.prog.made[g.c] || 0), g.n];
      case 'collect': return [Math.min(g.n, st.prog.coll[g.c] || 0), g.n];

  function consume(st, id) {

  /** 執行一個動作；回傳 {steps,total,depth,...}，不合法或沒效果則回傳 null */
  function act(st, a) {

    let res;

      if (!ok || !canPlace(st, a.x)) return null;
      consume(st, a.cid);

      const afterPlace = snap(st);
      res = resolve(st);
      res.afterPlace = afterPlace;
      res.found.push(a.cid);
      res.placed = { id: cell.id, c: a.cid, x: a.x };
      if (st.mode !== 'sandbox') st.turnsLeft--;

      if (st.mode === 'story' && !st.hand) {

      }
      refill(st);
    } else if (a.type === 'temp') {
      const nt = nextTemp(st, a.dir);
      if (nt == null || !hasCharge(st, 'temp')) return null;
      useCharge(st, 'temp');
      st.T = nt;
      res = resolve(st);
      st.moves++;
    } else if (a.type === 'spark') {
      if (!hasCharge(st, 'spark') || !sparkable(st)) return null;
      useCharge(st, 'spark');
      res = resolve(st, { spark: true });
      st.moves++;
    } else if (a.type === 'uv') {
      if (!hasCharge(st, 'uv') || !uvable(st)) return null;
      useCharge(st, 'uv');
      res = resolve(st, { uv: true });
      st.moves++;
    } else if (a.type === 'redraw') {

  const lite = (st) => { const s = JSON.parse(JSON.stringify({ ...st, levelStart: null, log: [] })); return s; };
  /** 預覽：在副本上試放，回傳得分與落點 */
  function simulatePlace(st, cid, x) {
    if (!canPlace(st, x)) return null;
    const s = { grid: st.grid.map((c) => c.slice()), T: st.T, up: st.up, uid: st.uid, relics: st.relics, cats: st.cats };
    const cell = place(s, cid, x);
    const landing = posOf(s, cell.id);
    let adj = 0;
    for (const [dx, dy] of DIRS) {

      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;

  }

  // ---------------------------------------------------------------- 提示
  /** 這個結果對目標的幫助（分數換算） */
  function goalGain(st, tally) {
    if (!st.goals) return 0;
    let g = 0;
    for (const go of st.goals) {
      if (go.t !== 'make' && go.t !== 'collect') continue;
      const have = (go.t === 'make' ? st.prog.made : st.prog.coll)[go.c] || 0;
      const need = Math.max(0, go.n - have);
      const got = (go.t === 'make' ? tally.made : tally.coll)[go.c] || 0;
      g += Math.min(need, got) * 120;
    }

  }
  function toolActions(st) {

    if (hasCharge(st, 'uv') && uvable(st)) out.push({ type: 'uv' });
    if (hasCharge(st, 'temp')) { if (nextTemp(st, 1) != null) out.push({ type: 'temp', dir: 1 }); if (nextTemp(st, -1) != null) out.push({ type: 'temp', dir: -1 }); }
    for (const k of TOOL_KEYS) {
      if (k === 'spark' || k === 'uv' || !hasCharge(st, k)) continue;
      if (TOOLS[k].aim === 'col') for (let x = 0; x < W; x++) out.push({ type: 'tool', k, x });
      else if (TOOLS[k].aim === 'cat') for (const c of st.catsAvail) { if (!st.cats.includes(c)) out.push({ type: 'tool', k, cat: c }); }

  /** 這個反應在這一關有沒有辦法觸發 */
  function reachable(st, rx) {

    if (rx.cat && (st.cats.includes(rx.cat.k) || (st.catsAvail.includes(rx.cat.k) && can('cat'))) && maxT >= rx.cat.t) return true;

    if (typeof rx.cond === 'number') return maxT >= rx.cond;
    if (rx.cond === 'burn') return can('spark') || (C[rx.a].ai != null && maxT >= C[rx.a].ai);

    if (rx.cond === 'uv') return can('uv');
    return false;
  }
  /** 這個分子對目標有沒有幫助（直接收集，或是能生成目標的反應物） */
  function goalReactant(st, cid) {
    let s = 0;
    for (const g of st.goals || []) {
      if (g.t !== 'make' && g.t !== 'collect') continue;
      if (g.t === 'collect' && cid === g.c) s += 40;
      for (const rx of RX) if ((rx.a === cid || rx.b === cid) && rx.full.includes(g.c) && reachable(st, rx)) { s += 30; break; }
      const c = C[cid];
      if (c.dec && c.dec.keep.includes(g.c)) s += 10;
      if (ELEC[cid] && ELEC[cid].keep.includes(g.c) && st.charges.electro > 0) s += 14;
      if (c.pho && c.pho.keep.includes(g.c) && st.charges.uv > 0) s += 14;

  }
  /** 落點旁邊的同種分子、之後可以觸發的反應夥伴 */
  function setupScore(st, cid, r) {
    if (!r.landing) return 0;
    const [lx, ly] = r.landing;
    let s = 0;
    const v = value(st, cid);
    for (const [dx, dy] of DIRS) {
      const c = st.grid[lx + dx] && st.grid[lx + dx][ly + dy];
      if (!c) continue;
      if (c.c === cid) s += v * 0.8;
      const list = PAIR.get(cid + '|' + c.c);
      if (list) for (const { rx } of list) {
        if (!reachable(st, rx)) continue;

  function followUp(st, a) {

  /** 下一步建議（提示列與電腦玩家共用）。rnd：電腦玩家用的隨機擾動 */

    for (const cid of cands) {

    if (tool && (!best || tool.v >= best.score * 0.7 || (best.now === 0 && best.fu.v <= tool.v * 1.5))) {

    }
    if (!best) return null;
    const a = { type: 'place', cid: best.cid, x: best.x };
    const base = { action: a, cid: best.cid, x: best.x, total: best.r.total, depth: best.r.depth, events: best.r.events, adj: best.r.adj, landing: best.r.landing, tally: best.r.tally };
    if (best.now > 0) return { kind: 'place', ...base };

  // ---------------------------------------------------------------- 謎題求解（給測試與提示用）
  function puzzleActions(st) {

    for (const cid of candidates(st)) for (let x = 0; x < W; x++) if (canPlace(st, x)) out.push({ type: 'place', cid, x });
    out.push(...toolActions(st));
    return out;

    for (const [, el] of tiles) { el.classList.add('instant'); posTile(el, +el.dataset.x, +el.dataset.y); }
    requestAnimationFrame(() => { for (const [, el] of tiles) el.classList.remove('instant'); });
    renderPreview();
  }
  function buildTicks() {
    let html = '';
    for (let r = 0; r <= L.H; r++) {
      const y = (L.H - r) * cell;
      const long = r % 2 === 0;
      html += `<i class="${long ? 'l' : ''}" style="top:${y}px"></i>`;
      if (long && r > 0) html += `<span style="top:${y}px">${r * 25}</span>`;
    }
    $('#ticks').innerHTML = html + '<em>mL</em>';
  }
  function buildScale() {
    const ol = $('#scale');
    ol.querySelectorAll('li').forEach((li) => li.remove());
    for (let i = L.TEMPS.length - 1; i >= 0; i--) {
      const T = L.TEMPS[i];
      const li = h('li', '', `<span class="t">${T.t}°</span><span class="n">${T.name}</span>`);
      li.dataset.i = i;
      li.style.setProperty('--tc', TCOL[i]);
      ol.appendChild(li);
    }
  }

  // ------------------------------------------------------------ 燒杯
  function posTile(el, x, y) { el.style.transform = `translate(${x * cell}px, ${y * cell}px)`; }
  function clearTiles() { for (const [, el] of tiles) el.remove(); tiles.clear(); }
  function renderGrid(grid, opt = {}) {
    const layer = $('#tiles');
    const alive = new Set();
    for (let x = 0; x < L.W; x++) {
      for (let y = 0; y < L.H; y++) {
        const c = grid[x][y];
        if (!c) continue;
        alive.add(c.id);
        let el = tiles.get(c.id);
        const ph = L.phaseAt(c.c, st.T);
        if (!el) {
          el = h('div', 'tile instant', tileInner(c.c));
          el.dataset.id = c.id;
          el.style.cssText = compStyle(c.c);
          el.dataset.phase = ph;
          tiles.set(c.id, el);
          layer.appendChild(el);
          if (opt.drop === c.id) {
            posTile(el, x, -1.3);
            el.getBoundingClientRect();
            el.classList.remove('instant');
            posTile(el, x, y);
          } else {
            el.classList.add('enter');
            posTile(el, x, y);
            el.getBoundingClientRect();
            el.classList.remove('instant');
            requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('enter')));
          }
        } else {
          el.dataset.phase = ph;
          posTile(el, x, y);
        }
        el.dataset.x = x;
        el.dataset.y = y;
      }
    }
    for (const [id, el] of tiles) {
      if (!alive.has(id)) {
        tiles.delete(id);
        el.classList.add('gone');
        setTimeout(() => el.remove(), 380);
      }
    }
  }
  function refreshPhases() { for (const [, el] of tiles) { const c = st.grid[+el.dataset.x] && st.grid[+el.dataset.x][+el.dataset.y]; if (c) el.dataset.phase = L.phaseAt(c.c, st.T); } }
  function fxBurst(fx) {
    const layer = $('#fx');
    for (const f of fx) {
      const el = h('div', 'fx fx-' + f.type);
      el.style.transform = `translate(${f.x * cell}px, ${f.y * cell}px)`;
      if (f.color) el.style.setProperty('--fxc', f.color);
      layer.appendChild(el);
      setTimeout(() => el.remove(), 900);
    }
  }
  function popScore(s) {
    if (!s.fx || !s.fx.length || !s.gain) return;
    const cx = s.fx.reduce((a, f) => a + f.x, 0) / s.fx.length + 0.5;
    const cy = s.fx.reduce((a, f) => a + f.y, 0) / s.fx.length + 0.5;
    const el = h('div', 'pop', `+${s.gain}${s.mult > 1 ? `<i>×${s.mult}</i>` : ''}`);
    el.style.left = cx * cell + 'px';
    el.style.top = cy * cell - 12 + 'px';
    $('#fx').appendChild(el);
    setTimeout(() => el.remove(), 1050);
  }
  function banner(text) {
    const el = h('div', 'banner', text);
    $('#beaker').appendChild(el);
    setTimeout(() => el.remove(), 950);
  }

  // ------------------------------------------------------------ 畫面各區
  function goalText(g) {
    const [a, b] = L.goalProgress(st, g);
    const done = a >= b;
    let t;
    switch (g.t) {
      case 'score': t = `分數 ${Math.min(shownScore, b)}/${b}`; break;
      case 'make': t = `做出 ${FM(g.c)} ${a}/${b}`; break;
      case 'collect': t = `收集 ${FM(g.c)} ${a}/${b}`; break;
      case 'clear': t = g.c ? `清掉所有 ${FM(g.c)}` : '清空燒杯'; break;
      case 'flames': t = `焰色 ${a}/${b} 種`; break;
      default: t = '';
    }
    return `<span class="gl${done ? ' done' : ''}">${done ? '✓ ' : ''}${t}</span>`;
  }
  function renderHeader() {
    const def = defOf(st);
    const mode = st.mode;
    $('#lvLabel').textContent = mode === 'story' ? def.id : mode === 'sandbox' ? '沙盒' : `第 ${st.level} 關`;
    $('#lvTitle').textContent = mode === 'story' ? def.title : mode === 'sandbox' ? '自由實驗' : '無限挑戰';
    $('#els').innerHTML = mode === 'sandbox' ? '' : st.unlocked.slice().sort(byZ).map((e) => `<i style="${atomStyle(e)}" title="${L.ELEMENTS[e].zh}">${e}</i>`).join('');
    $('#score').textContent = shownScore;
    const sg = st.goals && st.goals.find((g) => g.t === 'score');
    $('#targetBox').hidden = !sg;
    $('#meterBox').hidden = !sg;
    if (sg) { $('#target').textContent = sg.n; $('#meter').style.width = Math.min(100, (shownScore / sg.n) * 100) + '%'; }
    const others = (st.goals || []).filter((g) => g.t !== 'score');
    $('#goalList').innerHTML = others.map(goalText).join('');
    $('#goalList').hidden = !others.length;
    const showTurns = mode !== 'sandbox' && !st.hand;
    $('#turnsBox').hidden = !showTurns;
    if (showTurns) {
      $('#turns').textContent = st.turnsLeft;
      $('#turnsBox').classList.toggle('low', st.turnsLeft <= 3);
    }
  }
  const inf = (n) => (st.mode === 'sandbox' ? '∞' : n);
  function renderThermo() {
    const i = st.T;
    $$('#scale li').forEach((li) => {
      const k = +li.dataset.i;
      li.classList.toggle('on', k === i);
      li.classList.toggle('off', !st.temps.includes(k));
    });
    $('#scale').style.setProperty('--tc', TCOL[i]);
    $('#merc').style.height = `calc(${((i + 0.5) / L.TEMPS.length) * 100}% - 6px)`;
    $('#tN').textContent = inf(st.charges.temp);
    const play = st.phase === 'play';
    const can = L.hasCharge(st, 'temp');
    $('#heat').disabled = !play || !can || L.nextTemp(st, 1) == null;
    $('#cool').disabled = !play || !can || L.nextTemp(st, -1) == null;
    $('#vesselArea').dataset.temp = i;
    $('#srcLabel').textContent = `${L.TEMPS[i].name} ${L.TEMPS[i].t} °C`;
    $('#catBox').innerHTML = (st.cats || []).map((c) => `<span class="catchip" title="${L.CATALYSTS[c].desc}">${L.fHTML(c)} 觸媒</span>`).join('');
  }
  function renderTray() {
    const box = $('#tray');
    const trayP = $('.trayp');
    if (st.mode === 'sandbox') { trayP.hidden = true; return; }
    trayP.hidden = false;
    if (st.hand) {
      $('#trayTitle').textContent = '手牌';
      $('#trayHint').textContent = `剩 ${st.hand.length} 個分子`;
      box.classList.remove('dim');
      box.innerHTML = st.hand.map((id) => `<span class="hchip" style="${compStyle(id)}">${L.fHTML(id)}</span>`).join('') || '<span class="hint">手牌用完了</span>';
      return;
    }
    $('#trayTitle').textContent = '反應台';
    const use = sel ? new Set(L.atomsFor(st, sel)) : null;
    box.classList.toggle('dim', !!use);
    box.innerHTML = st.tray.map((e, i) => `<span class="atom${use && use.has(i) ? ' use' : ''}" style="${atomStyle(e)}" title="${L.ELEMENTS[e].zh}">${e}</span>`).join('');
    $('#trayHint').textContent = `${st.tray.length} 個原子`;
  }
  function sandboxList() {
    const q = pickQ.trim().toLowerCase();
    return Object.values(L.C).filter((c) => (!pickEl || c.els.includes(pickEl)) && (!q || c.id.toLowerCase().includes(q) || L.fText(c.id).toLowerCase().includes(q) || c.zh.includes(q)))
      .sort((a, b) => Math.max(...a.els.map((e) => L.ELEMENTS[e].z)) - Math.max(...b.els.map((e) => L.ELEMENTS[e].z)) || a.n - b.n).map((c) => c.id);
  }
  function renderPick() {
    const on = st.mode === 'sandbox';
    $('#pick').hidden = !on;
    if (!on) return;
    $('#pickEls').innerHTML = `<button type="button" class="pe${pickEl ? '' : ' on'}" data-e="">全部</button>` + L.ELEMENT_ORDER.map((e) => `<button type="button" class="pe${pickEl === e ? ' on' : ''}" data-e="${e}" style="${atomStyle(e)}">${e}</button>`).join('');
  }
  function renderCands() {
    const sandbox = st.mode === 'sandbox';
    const list = sandbox ? sandboxList() : L.candidates(st);
    if (sel && !list.includes(sel) && !sandbox) sel = null;
    $('#candTitle').textContent = sandbox ? `全部物質（${list.length}）` : st.hand ? '可以放的分子' : '可以合成';
    const box = $('#cands');
    if (!list.length) { box.innerHTML = `<div class="empty">${sandbox ? '找不到符合的物質。' : st.hand ? '手牌用完了。' : '合成不出東西了，試試重抽。'}</div>`; return; }
    box.innerHTML = list.map((id) => {
      const ph = L.phaseAt(id, st.T);
      return `<button class="cand${sel === id ? ' on' : ''}" type="button" data-id="${id}" style="${compStyle(id)}" aria-pressed="${sel === id}">` +
        `<span class="sw" data-phase="${ph}"></span><span class="cf">${L.fHTML(id)}</span><span class="cv">${L.value(st, id)}</span>` +
        `<span class="cn">${L.C[id].zh}</span><span class="cp">${PHN[ph]}</span></button>`;
    }).join('');
  }
  /** 這一關看得到的工具 */
  function toolList() {
    const out = [];
    const sb = st.mode === 'sandbox';
    for (const k of ['spark', 'uv']) if (sb || st.max[k] > 0) out.push(k);
    for (const k of L.TOOL_KEYS) if (k !== 'spark' && k !== 'uv' && (sb || st.max[k] > 0)) out.push(k);
    if (!st.hand && !sb) out.push('redraw');
    if (!sb) out.push('undo');
    else out.push('clear');
    return out;
  }
  function toolEnabled(k) {
    const play = st.phase === 'play';
    if (!play) return false;
    if (k === 'undo') return !!undo.length && st.charges.undo > 0;
    if (k === 'clear') return L.countIn(st) > 0;
    if (!L.hasCharge(st, k)) return false;
    if (k === 'spark') return L.sparkable(st);
    if (k === 'uv') return L.uvable(st);
    if (k === 'redraw') return true;
    if (k === 'cat') return st.catsAvail.some((c) => !st.cats.includes(c));
    if (L.TOOLS[k] && !L.TOOLS[k].aim) return !!L.simulateAction(st, { type: 'tool', k });
    if (L.TOOLS[k] && L.TOOLS[k].aim === 'col') return L.countIn(st) > 0;
    return true;
  }
  function renderTools() {
    const box = $('#tools');
    box.innerHTML = toolList().map((k) => {
      const n = k === 'clear' ? '' : `<b>${k === 'undo' || k === 'redraw' ? st.charges[k] : inf(st.charges[k])}</b>`;
      const title = L.TOOLS[k] ? L.TOOLS[k].desc : k === 'redraw' ? '把反應台上的原子全部換掉' : k === 'undo' ? '回到上一步' : '清空燒杯';
      return `<button class="btn tool${aim === k ? ' aiming' : ''}" type="button" data-k="${k}" title="${title}" ${toolEnabled(k) ? '' : 'disabled'}>${svg(k)}<span>${k === 'clear' ? '清空燒杯' : TOOLNAME(k)}</span>${n}</button>`;
    }).join('');
  }
  function condLabel(rx) {
    const out = [];
    if (rx.cat) out.push([`${L.fText(rx.cat.k)} 觸媒、≥${rx.cat.t} °C`, 'cat']);
    if (rx.cond === 'auto') out.push(['相鄰即反應', 'auto']);
    else if (rx.cond === 'spark') out.push(['火花（放電）', 'spark']);
    else if (rx.cond === 'uv') out.push(['紫外燈', 'uv']);
    else if (rx.cond === 'burn') out.push([L.C[rx.a].ai != null ? `火花，或 ≥${L.C[rx.a].ai} °C 自燃` : '火花點燃', 'burn']);
    else if (typeof rx.cond === 'number') out.push([`≥${rx.cond} °C`, 'heat']);
    return out;
  }
  const condHTML = (rx) => condLabel(rx).map(([l, c]) => `<span class="cond ${c}">${l}</span>`).join('');
  function logItem(l) {
    const g = `<span class="g">${l.gain ? '+' + l.gain : ''}${l.mult > 1 ? `<i>×${l.mult}</i>` : ''}</span>`;
    const vent = l.vent && l.vent.length ? ` <small>（${l.vent.map(L.fHTML).join('、')} 逸出）</small>` : '';
    if (l.k === 'rx') { const rx = L.RX[l.i]; return `<li><span class="k">${rx.kind}</span><span class="eq">${L.rxEquation(rx, true)}${vent}</span>${g}</li>`; }
    if (l.k === 'dec') return `<li><span class="k">熱分解</span><span class="eq">${L.decEquation(l.c, true)}${vent}</span>${g}</li>`;
    if (l.k === 'pho') return `<li><span class="k">光分解</span><span class="eq">${L.phoEquation(l.c, true)}${vent}</span>${g}</li>`;
    if (l.k === 'el') return `<li><span class="k">電解</span><span class="eq">${L.elecEquation(l.c, true)} <small>（${L.fHTML(l.out)} 在陽極收集）</small></span>${g}</li>`;
    if (l.k === 'tool') {
      const nm = TOOLNAME(l.t);
      if (l.t === 'cat') return `<li><span class="k">${nm}</span><span class="eq">加入 ${L.fHTML(l.cat)}（${L.CATALYSTS[l.cat].zh}）</span>${g}</li>`;
      if (l.t === 'funnel') return `<li><span class="k">${nm}</span><span class="eq">${L.fHTML(l.c)} 和 ${L.fHTML(l.c2)} 互換</span>${g}</li>`;
      if (l.t === 'centri') return `<li><span class="k">${nm}</span><span class="eq">依密度重新排列</span>${g}</li>`;
      if (l.t === 'flame') { const [col, zh] = L.FLAME[l.flame]; return `<li><span class="k">${nm}</span><span class="eq">${L.fHTML(l.c)} ×${l.n} <small style="color:${col}">● ${L.ELEMENTS[l.flame].zh}：${zh}色火焰</small></span>${g}</li>`; }
      return `<li><span class="k">${nm}</span><span class="eq">${L.fHTML(l.c)} ×${l.n} <small>${L.C[l.c].zh}</small></span>${g}</li>`;
    }
    return `<li><span class="k">收集</span><span class="eq">${L.fHTML(l.c)} ×${l.n} <small>${L.C[l.c].zh}</small></span>${g}</li>`;
  }
  function renderLog() {
    $('#log').innerHTML = st.log.length ? st.log.map(logItem).join('') : '<li class="empty" style="display:block;border:0">還沒有反應。把 3 個相同的分子連在一起，或讓會反應的分子靠在一起。</li>';
  }
  function compoundFacts(id) {
    const c = L.C[id];
    const f = [];
    if (c.mp === c.bp) f.push(`昇華點 <b>${fmtT(c.mp)}</b>`);
    else { f.push(`熔點 <b>${fmtT(c.mp)}</b>`); f.push(`沸點 <b>${fmtT(c.bp)}</b>`); }
    if (c.dec) f.push(`<b>≥${c.dec.t} °C</b> 分解`);
    if (c.ai != null) f.push(`自燃 <b>${c.ai} °C</b>`);
    f.push(`密度 <b>${c.d}</b>`);
    if (c.flame.length) f.push(`焰色 <b style="color:${L.FLAME[c.flame[0]][0]}">${L.FLAME[c.flame[0]][1]}</b>`);
    f.push(`價值 <b>${L.value(st, id)}</b>`);
    return f.map((x) => `<span>${x}</span>`).join('');
  }
  function knowList(id, els) {
    const c = L.C[id];
    const list = L.reactionsOf(id, els).map((rx) => `<li><span class="eq">${L.rxEquation(rx, true)}</span>${condHTML(rx)}</li>`);
    if (c.dec) list.unshift(`<li><span class="eq">${L.decEquation(id, true)}</span><span class="cond heat">≥${c.dec.t} °C 熱分解</span></li>`);
    if (c.pho) list.unshift(`<li><span class="eq">${L.phoEquation(id, true)}</span><span class="cond uv">紫外燈</span></li>`);
    if (L.ELEC[id]) list.unshift(`<li><span class="eq">${L.elecEquation(id, true)}</span><span class="cond auto">電解槽${L.ELEC[id].ph === 'l' ? '（要液態）' : ''}</span></li>`);
    return list;
  }
  function renderInspect() {
    const box = $('#inspect');
    $$('.tile.sel').forEach((e) => e.classList.remove('sel'));
    const pos = inspectId != null ? L.posOf(st, inspectId) : null;
    if (!pos) { box.hidden = true; inspectId = null; return; }
    const id = st.grid[pos[0]][pos[1]].c, c = L.C[id];
    const t = tiles.get(inspectId);
    if (t) t.classList.add('sel');
    const ph = L.phaseAt(id, st.T);
    const list = knowList(id, st.mode === 'sandbox' ? null : st.unlocked);
    box.innerHTML = `<button class="btn close" type="button" id="inspClose" aria-label="關閉">✕</button>
      <h3><span class="fm">${L.fHTML(id)}</span>${c.zh}</h3>
      <div class="facts"><span>現在是 <b>${PHN[ph]}</b></span>${compoundFacts(id)}</div>
      ${list.length ? `<ul class="rxlist">${list.slice(0, 16).join('')}</ul>` : '<div class="hint">以目前的元素，沒有會和它反應的物質。</div>'}
      ${c.simp ? '<p class="hint">這個物質的反應有簡化。</p>' : ''}`;
    box.hidden = false;
    $('#inspClose').onclick = () => { inspectId = null; renderInspect(); };
  }
  function renderPreview() {
    const bad = $('#badges'), gh = $('#ghosts');
    bad.innerHTML = '';
    gh.innerHTML = '';
    const play = st && st.phase === 'play';
    for (let x = 0; x < L.W; x++) {
      const b = h('div', 'badge');
      b.dataset.x = x;
      if (play && aim) {
        const p = L.simulateAction(st, { type: 'tool', k: aim, x });
        if (!p) { b.textContent = '—'; b.classList.add('num'); }
        else { b.textContent = p.total > 0 ? '+' + p.total : '✓'; b.classList.add('pos', 'aim'); if (p.depth >= 2) b.dataset.chain = p.depth; }
      } else if (play && sel) {
        const p = L.simulatePlace(st, sel, x);
        if (!p) { b.classList.add('full'); b.textContent = '滿'; }
        else {
          b.textContent = p.total > 0 ? '+' + p.total : '0';
          if (p.total > 0) b.classList.add('pos');
          if (p.depth >= 2) b.dataset.chain = p.depth;
          const g = h('div', 'ghost', '<div class="body"></div>');
          g.dataset.x = x;
          g.style.transform = `translate(${p.landing[0] * cell}px, ${p.landing[1] * cell}px)`;
          gh.appendChild(g);
        }
      } else { b.textContent = x + 1; b.classList.add('num'); }
      bad.appendChild(b);
    }
    $('#vesselArea').classList.toggle('aiming', !!aim);
  }
  function hoverCol(x) {
    const hi = $('#hiLayer');
    hi.innerHTML = '';
    if (pulseX != null) { const p = h('div', 'colpulse'); p.style.left = pulseX * cell + 'px'; hi.appendChild(p); }
    $$('.ghost').forEach((g) => g.classList.toggle('hot', x != null && +g.dataset.x === x));
    if (x == null) return;
    const c = h('div', 'colhi');
    c.style.left = x * cell + 'px';
    hi.appendChild(c);
  }
  function renderAll() {
    renderHeader(); renderThermo(); renderTray(); renderPick(); renderCands(); renderTools(); renderLog();
    renderGrid(st.grid); renderPreview(); renderInspect(); markTiles(); renderCoach();
  }

  // ------------------------------------------------------------ 下一步提示
  function why(ev) {
    if (!ev) return '會得分';
    if (ev.k === 'cl') return `湊成 ${ev.n} 個 ${FM(ev.c)} 相連，收集`;
    if (ev.k === 'dec') return `${FM(ev.c)} 受熱分解`;
    if (ev.k === 'pho') return `${FM(ev.c)} 照光分解`;
    if (ev.k === 'el') return `電解 ${FM(ev.c)}`;
    if (ev.k === 'tool') return ev.c ? `${TOOLNAME(ev.t)}：${FM(ev.c)}` : TOOLNAME(ev.t);
    const rx = L.RX[ev.i];
    return `${FM(rx.a)} 和 ${FM(rx.b)} 會${rx.cond === 'burn' ? '燃燒' : '反應'}（${rx.kind}）`;
  }
  function actText(a) {
    if (a.type === 'spark') return '按「火花」';
    if (a.type === 'uv') return '開「紫外燈」';
    if (a.type === 'temp') { const n = L.nextTemp(st, a.dir); return a.dir > 0 ? `加熱到 ${L.TEMPS[n].t} °C` : `冷卻到 ${L.TEMPS[n].t} °C`; }
    if (a.type === 'tool') {
      if (a.k === 'cat') return `加入 ${FM(a.cat)} 觸媒`;
      return L.TOOLS[a.k].aim === 'col' ? `用「${TOOLNAME(a.k)}」處理第 <b>${a.x + 1}</b> 欄` : `用「${TOOLNAME(a.k)}」`;
    }
    if (a.type === 'place') return `把 ${FM(a.cid)} 放在第 <b>${a.x + 1}</b> 欄`;
    return '';
  }
  function hintHTML(hn) {
    const pts = hn.total > 0 ? `，<span class="pts">+${hn.total}</span>` : '';
    const chain = hn.depth >= 2 ? `，還會連鎖 ${hn.depth} 段` : '';
    switch (hn.kind) {

  function placeBubble(el, rect, prefer) {
    const bw = el.offsetWidth, bh = el.offsetHeight, m = 12;
    const fitsBelow = rect.bottom + bh + m <= innerHeight - 8, fitsAbove = rect.top - bh - m >= 8;
    let side = prefer || 'below';
    if (side === 'below' && !fitsBelow) side = fitsAbove ? 'above' : 'right';
    else if (side === 'above' && !fitsAbove) side = fitsBelow ? 'below' : 'right';
    el.dataset.side = side;
    if (side === 'right') {
      const left = Math.min(innerWidth - bw - 12, rect.left + rect.width + m);
      const top = Math.max(8, Math.min(innerHeight - bh - 8, rect.top + rect.height / 2 - bh / 2));
      el.style.left = Math.max(12, left) + 'px';

      el.style.setProperty('--ay', Math.max(14, Math.min(bh - 28, rect.top + rect.height / 2 - top - 7)) + 'px');
      return;
    }
    const top = side === 'below' ? rect.bottom + m : rect.top - bh - m;
    const cx = rect.left + rect.width / 2;
    const left = Math.max(12, Math.min(innerWidth - bw - 12, cx - bw / 2));
    el.style.top = Math.max(8, Math.min(innerHeight - bh - 8, top)) + 'px';

  // ----- 無限挑戰
  function offerView(o) {
    const atom = (e) => `<span class="atom bigatom" style="${atomStyle(e)}">${e}</span>`;
    const E = o.e ? L.ELEMENTS[o.e] : null;
    switch (o.type) {
      case 'element': {
        const after = st.unlocked.concat(o.e);
        const n = Object.values(L.C).filter((c) => c.els.includes(o.e) && c.els.every((e) => after.includes(e))).length;
        return ['新元素', `${atom(o.e)}${E.zh}`, `原子序 ${E.z}。加入元素袋，馬上多出 ${n} 種含${E.zh}的物質可以合成。`];
      }
      case 'tray': return ['反應台', '反應台 +1 格', `一次拿 ${st.traySize + 1} 個原子，能合成更大的分子；分子越大越值錢。`];
      case 'max': return ['工具', `${TOOLNAME(o.k)} +1 次`, `之後每一關都能多用一次「${TOOLNAME(o.k)}」。`];
      case 'upgrade': { const now = L.upMult(st, o.e); return ['元素強化', `${atom(o.e)}${E.zh} 強化`, `所有含${E.zh}的分子價值 ×${now} → ×${now + 0.5}（多種元素強化會相乘）。`]; }
      case 'enrich': return ['元素袋', `${atom(o.e)}多一點${E.zh}`, `反應台更常出現${E.zh}（比重 +2）。`];
      case 'relic': return ['實驗器材', L.RELICS[o.r].zh, L.RELICS[o.r].desc + '。'];
    }
    return ['', '', ''];
  }

  function swatch(ph, e) { return `<span class="sw" data-phase="${ph}" style="--c1:${EC(e)};--cg:${EC(e)}"></span>`; }
  function openHelp(first, back) {

  function openBook(tab = 'mol', back) {
    const found = new Set(meta.found);
    const all = Object.values(L.C).slice().sort((a, b) => {
      const za = Math.max(...a.els.map((e) => L.ELEMENTS[e].z)), zb = Math.max(...b.els.map((e) => L.ELEMENTS[e].z));
      return za - zb || a.n - b.n;
    });
    const nRx = L.RX.length + Object.values(L.C).filter((c) => c.dec).length + Object.values(L.C).filter((c) => c.pho).length + Object.keys(L.ELEC).length + Object.keys(L.FLAME).length;
    let body;
    if (tab === 'mol') {
      body = `<div class="legend"><span><i style="background:#8aa0bf"></i>固</span><span><i style="background:#4fb3ff"></i>液</span><span><i style="background:#ffd27a"></i>氣</span><span><i style="background:#c79bff"></i>分解</span><span>（由左到右：${L.TEMPS.map((t) => t.t).join('、')} °C）</span></div><div class="book">` +

          if (!found.has(c.id)) return `<div class="bcard locked"><span class="fm">？？？</span><span class="nm">${dots} ${c.n} 個原子</span></div>`;

          return `<button type="button" class="bcard" data-id="${c.id}" style="--c1:${mainCol(c.id)}"><span class="fm">${L.fHTML(c.id)}</span><span class="nm">${c.zh}</span><span class="phases">${phases}</span></button>`;
        }).join('') + '</div>';
    } else {
      const items = meta.rx.map((k) => {
        const [p, id] = k.split(':');

    showOverlay(`<h2>圖鑑</h2><div class="tabs"><button type="button" data-tab="mol" class="${tab === 'mol' ? 'on' : ''}">物質 ${found.size}/${Object.keys(L.C).length}</button><button type="button" data-tab="rx" class="${tab === 'rx' ? 'on' : ''}">反應 ${meta.rx.length}/${nRx}</button></div>${body}
      <div class="acts"><button class="btn primary" type="button" id="bookClose">${back ? '返回' : '關閉'}</button></div>`, back ? 'home' : '');

  function firstTips() {
