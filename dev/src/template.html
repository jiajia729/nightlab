<title>夜間實驗室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/*CSS*/
</style>

<div class="app" id="app">
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6.2L4.6 18.6A1.6 1.6 0 0 0 6 21h12a1.6 1.6 0 0 0 1.4-2.4L14 9.2V3"/><path d="M7.2 15h9.6"/><circle cx="10.5" cy="17.6" r=".6" fill="currentColor"/><circle cx="13.6" cy="18.4" r=".5" fill="currentColor"/></svg>
      <h1>夜間實驗室</h1>
    </div>
    <div class="lv"><b id="lvLabel">1-1</b><span class="lvt" id="lvTitle"></span><div class="els" id="els"></div></div>
    <div class="goal">
      <div class="row"><span>分數 <b id="score">0</b></span><span class="t" id="targetBox">目標 <span id="target">60</span></span></div>
      <div class="meter" id="meterBox"><i id="meter"></i></div>
      <div class="glist" id="goalList"></div>
    </div>
    <div class="turns" id="turnsBox"><b id="turns">14</b><span>剩餘回合</span></div>
    <nav class="nav">
      <button class="btn" id="btnHome" type="button" aria-label="主選單"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v9h11v-9"/><path d="M10 19v-5h4v5"/></svg></button>
      <button class="btn" id="btnBook" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19"/><path d="M9 7h6M9 10.5h4"/></svg>圖鑑</button>
      <button class="btn" id="btnHelp" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.1-2.4 3.6"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>規則</button>
      <button class="btn" id="btnMenu" type="button" aria-label="選單"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
    </nav>
  </header>

  <div class="coach" id="coach" aria-live="polite">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.4 1.1 2.2h5c0-.8.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
    <span class="txt" id="coachText"></span>
    <span class="need" id="coachNeed"></span>
    <button class="btn" type="button" id="coachShow">示範</button>
  </div>

  <main class="stage">
    <section class="thermo" aria-label="溫度控制">
      <button class="tbtn hot" id="heat" type="button" title="加熱一段"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c.6 3.2 4.6 5 4.6 9.6a4.6 4.6 0 0 1-9.2 0c0-2 .9-3.3 2-4.2.2 1.3.8 2.2 1.7 2.6C11 8.5 11.3 5.6 12 3z"/><path d="M12 14.2c.9 1 1.6 1.7 1.6 2.8a1.6 1.6 0 0 1-3.2 0c0-1.1.7-1.8 1.6-2.8z"/></svg><span>加熱</span></button>
      <ol class="scale" id="scale"><span class="merc" id="merc"></span></ol>
      <div class="tcount">溫控 <b id="tN">3</b> 次</div>
      <button class="tbtn cold" id="cool" type="button" title="冷卻一段"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 2.5v19M3.8 7.25l16.4 9.5M3.8 16.75l16.4-9.5"/><path d="M9.5 4l2.5 2.5L14.5 4M9.5 20l2.5-2.5 2.5 2.5M4.2 10.6l3.4.9-.9 3.4M19.8 10.6l-3.4.9.9 3.4"/></svg><span>冷卻</span></button>
    </section>

    <section class="vessel-area" id="vesselArea" data-temp="3">
      <div class="badges" id="badges" aria-label="各欄預估得分"></div>
      <div class="beaker" id="beaker">
        <div class="ticks" id="ticks"></div>
        <div class="slots"></div>
        <div class="layer" id="hiLayer"></div>
        <div class="layer" id="ghosts"></div>
        <div class="layer" id="tiles"></div>
        <div class="layer" id="fx"></div>
      </div>
      <div class="source"><span class="heat"></span><span id="srcLabel">室溫 25 °C</span><span class="cats" id="catBox"></span></div>
    </section>

    <section class="side">
      <div class="panel trayp">
        <header><h2 id="trayTitle">反應台</h2><span class="hint" id="trayHint"></span></header>
        <div class="tray" id="tray"></div>
      </div>
      <div class="panel candp">
        <header><h2 id="candTitle">可以合成</h2><span class="hint" id="candHint">點選後再點燒杯的一欄，或直接拖過去</span></header>
        <div class="pick" id="pick" hidden><div class="pickels" id="pickEls"></div><input type="search" id="pickQ" placeholder="搜尋化學式或名稱" autocomplete="off"></div>
        <div class="cands" id="cands"></div>
      </div>
      <div class="tools" id="tools"></div>
      <div class="panel logp">
        <header><h2>實驗紀錄</h2><span class="hint">點燒杯裡的分子看資料</span></header>
        <ol class="log" id="log"></ol>
        <div class="inspect" id="inspect" hidden></div>
      </div>
    </section>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
/*LOGIC*/
</script>
<script>
/*UI*/
</script>
